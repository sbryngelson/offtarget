# Agent decisions for the claim mismatches and omp_vv flags the
# confirmer left needs_human (tools/confirm.py triage;
# offload/engine/confirm/triage.py applies the first matching decision to each
# needs_human item: by `key` (an fnmatch pattern) or by `programs`
# (any case of the item is of one of them), optionally restricted to
# `toolchains` (the item's compiler; gfx90a twins included) and `kind`).
# Fix: the defaultmap(none), C nohost and C device(ancestor)
# decisions are withdrawn: every family rejects those programs, so the
# the amendment of ruling C decides them (rule R12a with an independent
# witness, a quoted legality reading and a vendor claim, else
# unsupported_everywhere). The
# gfortran/gcc -fopenmp witnesses are withdrawn, so those cells are
# unsupported_everywhere; their legality rests on the quoted spec text.
# Every decision cites the spec text, the program line, the stored rows or
# probe it rests on.
#
# `spot_checks`: the seeded 10% sample of decided cases per verdict class
# (triage.spot_sample), each re-read by an agent: agree true/false and why.
version: 1
decisions:

  # --- claim mismatches -----------------------------------------------------------

  - programs: [acc34-directive-init, acc34-directive-set, acc34-directive-shutdown]
    disposition: compiler_bug
    finding: data/findings/cce-acc-init-set-runtime-assert.f90
    reason: >-
      Legal OpenACC 3.4 (§2.14.1 init, §2.14.2 shutdown, §2.14.3 set: the
      clauses are optional). CCE 19/20/21 abort in libcrayacc on every run,
      both modes and both GPUs: "_cray_acc_init_device ... Incorrect device
      type set" (init, set) and "_cray_acc_shutdown_device ... Shutting down
      incorrect device type" (shutdown) (results/acc_matrix.jsonl stderr).
      The existing finding reproduces the init/set abort; its header now
      records the plain shutdown too. Expected value: the program's own
      check (only source), but a runtime assertion is no value question.

  - programs: [omp52-c-clause-collapse, omp52-c-clause-lastprivate, omp52-c-clause-lastprivate-conditional, omp60-c-clause-lastprivate-conditional, omp52-c-clause-schedule-auto, omp52-c-clause-schedule-dynamic, omp52-c-clause-schedule-guided, omp52-c-clause-schedule-monotonic, omp52-c-clause-schedule-runtime, omp52-c-clause-schedule-simd]
    disposition: compiler_bug
    finding: data/findings/cce-c-parallel-for-in-target.c
    reason: >-
      CCE craycc 19/20/21 lose iterations or the lastprivate value of a
      parallel for nested in a target region with schedule(static) (no
      chunk), schedule(dynamic) or the catalog's other schedule kinds, or
      lastprivate (schedule(static, 4) runs correctly, the finding); every iteration must run
      (5.2 §11.5 pp.247-250) and lastprivate takes the sequentially last value
      (5.2 §5.4.5 p.115). Probe (results/t27b/probes.jsonl, both modes):
      parallel for schedule(dynamic) bad on CCE 19/20/21 with or without
      default(none) shared(a, b); without a schedule clause correct; AFAR
      correct everywhere; the Fortran forms run correctly on CCE. The
      finding's header now records schedule(dynamic).

  # Fix: the C 5.2 device_type ports use enter(f) now;
  # device_type and device_type.any compile and run on every compiler and
  # GPU (their mismatches are gone), the clang `to` rejection is the finding
  # clang-c-declare-target-to-omp52.c only.
  - programs: [omp52-c-clause-from-iterator, omp52-c-clause-map-iterator, omp52-c-clause-to-iterator]
    disposition: compiler_bug
    finding: data/findings/afar-c-update-iterator-copy-mode.c
    reason: >-
      AFAR amdclang moves no data for a map or motion clause with an
      iterator modifier in copy mode (HSA_XNACK=0); the finding reproduces
      it (bad= 64, 3 runs; correct at HSA_XNACK=1 and without the
      iterator). Expected value: derivation and model agree (5.2 §3.2.6
      p.67).

  - programs: [omp52-c-clause-if-directive_name]
    disposition: our_error
    reason: >-
      Our program was nonconforming. if(parallel: use_dev) on target teams
      distribute parallel for is split to the parallel leaf and its
      expression "evaluated immediately before the construct to which the
      clause has been split ... (therefore inside of the outer leaf
      constructs)" (5.2 §17.2 p.340); default(none) applies to every leaf
      that permits it, teams included (same section), so use_dev,
      referenced in the teams region, must be listed (5.2 §5.4.1 p.109).
      clang was right to reject it. Fixed in the generator
      (offload/engine/gen_templates.py if_dnm_prog: shared(..., use_dev, ...));
      the Fortran 5.0/5.2/6.0 and C 5.2/6.0 programs reran on every
      compiler, both modes and gfx90a (report).

  - programs: [omp52-c-directive-target_parallel_for_simd, omp52-c-directive-target_teams_distribute_parallel_for_simd, omp52-c-directive-target_parallel_loop, omp60-c-directive-target_parallel_loop]
    kind: mismatch
    disposition: compiler_bug
    finding: data/findings/clang-c-shared-declare-target-combined.c
    reason: >-
      A declare target variable listed in shared on a combined target
      construct is read with its host value by both clang C front ends
      (AFAR amdclang, CCE craycc 19/20/21), every mode and GPU (the
      finding reproduces it; 5.2 §17.2 p.340: shared applies only to the
      leaves that permit it; §5.8.1 p.148: the declare target variable is
      treated as map(tofrom) and is present). The Fortran forms pass on
      every compiler.

  - programs: [omp52-clause-indirect]
    toolchains: [cce19, cce20]
    disposition: version_scope
    reason: >-
      The claim is the OpenMP 5.1 feature list's "indirect clause"; the 5.2
      program spells the declare target clause enter(f) (5.2 §7.8.1 p.206),
      which CCE 19/20 do not accept ("INDIRECT, LINK, TO or DEVICE_TYPE was
      expected but found E"); CCE 21, whose page lists "enter clause
      (Fortran only)" among its 5.2 features, compiles and runs it. The
      indirect clause itself is not measured on 19/20.

  - programs: [omp52-clause-linear-val, omp60-clause-linear-val]
    toolchains: [cce19, cce20]
    disposition: version_scope
    reason: >-
      The claim is release-level ("full OpenMP 5.0"; the atom exists in 4.5
      as linear(val(x))); the 5.2 program uses the 5.2 modifier syntax
      linear(x: val, step(1)) (5.2 §5.4.6 p.117), which CCE 19/20 read as
      a variable named VAL (ftn-113). Only CCE 21 lists "new linear clause
      syntax (Fortran only)".

  - programs: [omp52-clause-linear-val, omp60-clause-linear-val]
    toolchains: [cce21]
    disposition: compiler_bug
    finding: data/findings/cce21-linear-modifier-default-none.f90
    reason: >-
      CCE 21 claims the 5.2 linear syntax but rejects linear(x: val,
      step(1)) under default(none): "Variable X must have its data scope
      explicitly declared because DEFAULT(NONE) was specified" although x
      is in the linear clause, a data-sharing attribute clause (5.2 §5.4.6
      p.117; §5.4.1 p.109). Probe linear_mod.f90 / linear_mod_nodn.f90.

  - programs: [omp60-c-clause-defaultmap-self]
    toolchains: [cce20]
    disposition: partial_support
    reason: >-
      CCE 20.0.0 release notes: "[6.0] ... self mapping for accelerators".
      craycc 20 compiles and runs map(self: a) (omp60-c-clause-map-self,
      both modes) but rejects defaultmap(self: aggregate) ("expected
      'alloc', 'from', 'to', 'tofrom', ..."): self mapping for the map
      clause only.

  # Fix (review m3): a correction of a computed disposition
  # (`override`), not of the cell verdict (R05 unsupported stays)
  - key: "mismatch:omp:f90:cce19:omp.clause.defaultmap.firstprivate:52:hpe-cce-intro-openmp:supported"
    override: true
    disposition: compiler_bug
    reason: >-
      CCE 19 says "Unsupported OpenMP construct Private of allocatables --
      b", but b is explicitly mapped (map(from: b)) and defaultmap applies
      only to variables with an implicit data-mapping attribute (5.2
      §5.8.1 p.148, §5.8.7 p.161): CCE 19 applies defaultmap(firstprivate)
      to an explicitly mapped allocatable, a compiler defect rather than a
      documentation overclaim. CCE 20 runs the program correctly.

  # --- omp_vv flags ------------------------------------------------------------------

  - key: "flag:f90:*:omp.clause.defaultmap:cce19:*"
    disposition: compiler_bug
    reason: >-
      Three suite tests, three causes, none contradicting our cells:
      test_target_defaultmap_default.F90 faults on CCE 19 only ("Memory
      access fault by GPU"; CCE 20/21 and AFAR pass, both GPUs) - a CCE 19
      bug fixed in 20; the test is legal (its pointer is disassociated on
      entry and exit, 5.2 §13.8 p.287). test_target_teams_distribute_
      parallel_for_defaultmap.F90 and test_target_defaultmap_firstprivate
      .F90 are rejected for other features: a private Fortran character
      array (ftn-7032; a documented CCE 19 limitation, intro_openmp(7)
      19.0.0 Limitations: "OpenMP target regions may not refer to ...
      arrays of type Fortran character") and firstprivate of allocatables
      ("Unsupported OpenMP construct Private of allocatables").

  - key: "flag:f90:*:omp.clause.defaultmap.*:cce19*"
    disposition: unsupported_form
    reason: >-
      The only narrow suite test, test_target_teams_distribute_parallel_
      for_defaultmap.F90, is rejected by CCE 19 for another feature: a
      private Fortran character array (ftn-7032 "Unsupported OpenMP
      construct Fortran character"), a limitation intro_openmp(7) of CCE
      19.0.0 documents ("OpenMP target regions may not refer to Fortran
      character variables of symbolic length, arrays of type Fortran
      character, or any Fortran character operation other than assignment,
      comparison, and substring"; the sentence is gone from the CCE 20 and
      21 pages). Not a contradiction of our scalar/tofrom cells.

  - key: "flag:f90:*:omp.clause.defaultmap.firstprivate:*"
    disposition: unsupported_form
    reason: >-
      test_target_defaultmap_firstprivate.F90 makes an allocatable array
      firstprivate through defaultmap(firstprivate) (legal, 5.2 §5.8.7);
      CCE 19/20/21 say "Unsupported OpenMP construct Private of
      allocatables" (AFAR: not yet implemented). Our program's scalar form
      runs; not a contradiction.

  - key: "flag:f90:*:omp.clause.defaultmap*"
    disposition: compiler_bug
    finding: data/findings/afar-cce19-character-defaultmap.f90
    reason: >-
      test_target_teams_distribute_parallel_for_defaultmap.F90 fails (run
      exit 1) on AFAR and CCE 20 at its check scalar_char .ne. 'b': a
      Fortran character scalar is an aggregate (5.2 §1.2.6), implicitly
      tofrom, and both compilers treat it as firstprivate (the finding;
      CCE 21 correct). On CCE 19 the test is rejected for a private
      character array (a documented CCE 19 limitation). The suite is right;
      our defaultmap programs use no character data.

  - key: "flag:c:*:omp.clause.map.iterator:afar:*"
    disposition: test_bug
    upstream: >-
      tests/5.2/declare_mapper/test_declare_mapper_iterator.c line 26:
      `map(iterator(it = 0:v.len), tofrom: v.data[it])` instantiates the
      list items v.data[0], ..., v.data[v.len-1], which all have the base
      pointer v.data. OpenMP 5.1 §2.21.7.1 p.353 (also 5.2 §5.8.3 p.156,
      6.0 §7.9.6 p.286): "If an expression that is used to form a list item
      in a map clause contains an iterator identifier, the list item
      instances that would result from different values of the iterator
      must not have the same containing array and must not have base
      pointers that share original storage." Filed as OpenMP_VV#921.
      Suggested fix: an iterator whose instances are sections of distinct
      storage (an array of pointers, map(iterator(it = 0:M), tofrom:
      p[it][0:N])), or a single-value iterator. The same defect in
      tests/5.1/target/test_target_map_iterators.{c,F90} (all instances in
      the containing array test_lst) was fixed upstream (issue #868, PR
      #869: test_lst[it][:1] over an array of pointers); the fixed Fortran
      test passes on CCE 19/20/21 on both GPUs (rerun), the fixed C
      test is still rejected by AFAR amdclang and CCE craycc at the default
      OpenMP 5.1 ("incorrect map type modifier", the front-end defect
      clang-c-map-iterator-omp51.c). Observed: every compiler
      fails the declare_mapper_iterator test at link time ("undefined
      symbol: it").
    reason: >-
      Suite test bug (fix; re-read:
      test_declare_mapper_iterator.c is byte-identical in OpenMP_VV
      f7d95b34, so the decision carries): the remaining failing narrow test
      maps iterator instances with one base pointer, which 5.1 §2.21.7.1
      p.353 / 5.2 §5.8.3 p.156 forbid (the static rule map-clause-005).
      test_target_map_iterators.c changed upstream (fixed) and is no longer
      a failing narrow test of this flag. Our map.iterator program uses a
      single-value iterator (legal) and passes on AFAR.

  - key: "flag:c:*:omp.clause.map.always:cce*"
    disposition: compiler_bug
    finding: data/findings/cce-c-map-present-assert.c
    reason: >-
      Re-decided (both failing narrow tests are new or changed
      upstream). tests/5.2/declare_mapper/test_declare_mapper_present.c was
      fixed upstream: the enter data now also maps the pointer member
      (`map(alloc: s.data)`), so every member of `s` has corresponding
      storage and the present mapper's list item `v` is present (5.2 §5.8.3
      p.152, p.156); AFAR passes it in both modes on both GPUs (it
      terminated at HSA_XNACK=0 on the old version), and CCE craycc
      19/20/21 still abort in the runtime ("Assertion `clang_flags == 0'",
      the finding). tests/6.0/decl_attribute/test_c_decl_attribute2.c (new)
      fails on every compiler: both C front ends ignore the OpenMP 6.0
      attribute syntax ("unknown attribute 'omp::decl' ignored"), so the
      declare target variable is undefined in the device image (link
      error); an unimplemented 6.0 form, not a contradiction of our
      map.always cells, which stand.

  - programs: [omp52-c-directive-target_parallel_loop, omp60-c-directive-target_parallel_loop]
    kind: flag
    disposition: compiler_bug
    finding: data/findings/clang-c-shared-declare-target-combined.c
    reason: >-
      Our C target parallel loop program fails on every compiler because
      of the clang shared(declare target) bug (the finding); the suite's
      narrow test does not list a declare target variable in shared, so
      it passes. The Fortran program passes on every compiler.


  - key: "flag:*:*:omp.clause.firstprivate:cce19*:*:ours_ok_suite_fails"
    disposition: unsupported_form
    reason: >-
      The only failing narrow test, tests/5.1/target/
      test_target_is_accessible.{c,F90} (changed upstream in OpenMP_VV
      #891), calls the OpenMP 5.1 routine omp_target_is_accessible, which
      CCE 19 does not provide: craycc links with "undefined symbol:
      omp_target_is_accessible", crayftn's omp_lib has no interface for it
      (ftn-233, no explicit type under IMPLICIT NONE). CCE 20 and 21 have
      it. Not a contradiction of our firstprivate cells.

  - key: "flag:*:*:omp.clause.firstprivate:*:gfx90a:ours_ok_suite_fails"
    disposition: test_bug
    upstream: >-
      tests/5.1/target/test_target_is_accessible.c and .F90 (as changed by
      OpenMP_VV #891) treat a false result of omp_target_is_accessible as a
      failure. The routine "returns true if the storage of size bytes
      starting at the address given by ptr is accessible from device
      device_num. Otherwise, it returns false" (OpenMP 5.1 §3.8.4 p.417;
      5.2 §18.8.4 p.390; 6.0 §25.2.2 pp.605-606: non-zero / zero), so false
      is the conforming answer for malloc'ed (C) or allocated (Fortran)
      host memory on a device without unified shared memory. C: when the
      routine returns false, check_device() returns
      OMPVV_SKIPPED_EXIT_CODE, but main() does
      `OMPVV_TEST_AND_SET_VERBOSE(errors, check_device() != 0)`, so the
      skip becomes errors = 1 and the test reports "Test failed" and exits
      1 instead of skipping. Fortran: the ELSE branch does
      `OMPVV_TEST_AND_SET(errors, check_test.EQ.0)` ("This test will be
      skipped with error = 1"), a failure by construction. Suggested fix:
      propagate the skip (C: `int r = check_device(); if (r ==
      OMPVV_SKIPPED_EXIT_CODE) OMPVV_REPORT_AND_RETURN(r);`; Fortran: no
      error when the routine returns false, or a skip status), or require
      unified_shared_memory as test_target_is_accessible_with_usm.c does.
      Observed: on a discrete MI250X (gfx90a) and on the MI300A at
      HSA_XNACK=0, AFAR and CCE 20/21 return false and the test fails with
      "omp_target_is_accessible returned false"; at HSA_XNACK=1 (MI300A)
      they return true and the test passes.
    reason: >-
      Suite test bug (new; spec cited above): on gfx90a every
      compiler that provides the routine returns false (host memory is not
      device accessible there) and the test turns that conforming answer
      into a failure. Our firstprivate cells stand (CCE 19 on gfx90a lacks
      the routine altogether: the decision above).

  - key: "flag:f90:*:omp.directive.loop:afar*:*:ours_ok_suite_fails"
    disposition: compiler_bug
    reason: >-
      New test tests/5.0/loop/test_loop_iterator.F90: inside a
      target region, a standalone `!$omp loop` over `DO i = 1, N` followed
      by `temp = i`, checked against N+1. "The loop iteration variable(s)
      in the associated do-loop(s) of a loop construct is (are)
      lastprivate" (OpenMP 5.0 §2.19.1.1 p.271; the same in 5.2 §5.1.1),
      and a lastprivate DO variable has the value it has after the loop
      completes (OpenMP Examples lastprivate.1.f: "I has the value of N
      here" after DO I=1,N-1), so N+1 is right. AFAR (MI300A both modes,
      MI250X) warns "Detected standalone OpenMP `loop` directive with
      thread binding, the associated loop will be rewritten to `simd`" and
      the check fails (exit 1); CCE 19/20/21 pass on both GPUs. An AFAR
      defect in a form our loop programs do not use (they do not read the
      iteration variable after the construct); no finding written yet.

