  # Defaultmap(firstprivate) with explicit map(from)/map(tofrom)
  # items: NVHPC (25.11 and 26.9) does not copy the explicitly mapped
  # items back (their check fails in both memory modes); the explicit
  # clause determines their attributes, defaultmap only the implicit ones.
  # Its separate-memory runs joined the expected verdict as another family
  # and disputed the AMD value; the finding withdraws them.
  - {version: 50, program: omp50-clause-defaultmap-firstprivate, disposition: compiler_wrong,
     cite: "5.0 §2.19.7.2 p.324", finding: data/findings/nvhpc-defaultmap-firstprivate-explicit-map.f90,
     withdraw: [nvhpc, nvhpc269]}
  - {version: 52, program: omp52-clause-defaultmap-firstprivate, disposition: compiler_wrong,
     cite: "5.2 §5.8.7 p.161", finding: data/findings/nvhpc-defaultmap-firstprivate-explicit-map.f90,
     withdraw: [nvhpc, nvhpc269]}
  - {version: 60, program: omp60-clause-defaultmap-firstprivate, disposition: compiler_wrong,
     cite: "6.0 §7.9.9 p.291", finding: data/findings/nvhpc-defaultmap-firstprivate-explicit-map.f90,
     withdraw: [nvhpc, nvhpc269]}
