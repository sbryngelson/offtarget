    observable: "an allocated (C: malloc'd) a(i) = i; the region sets a(i) = 2*a(i) + 1: the host sees 2*i + 1"
    template: usm_array
    spec:
      - {version: "OpenMP 5.0", section: "2.4", page: 62, lines: "10", quote: "The unified_shared_memory clause makes the map clause optional on target constructs"}
      - {version: "OpenMP 5.2", section: "8.2.1", page: 212, lines: "35", quote: "The unified_shared_memory clause makes map clauses optional on target constructs"}
      - {version: "OpenMP 6.0", section: "10.5.1.5", page: 360, lines: "21-22", quote: "The implementation must guarantee that storage locations in memory are accessible to threads on all accessible devices"}

