  - id: RUL-MAPPED-FLAG-NOT-COPIED-BACK
    # process, not spec_reading: a spec reading that names programs is a
    # derivation of their claimed value (collectors.Derivation); this
    # ruling decides how CCE 21's cells read, not what the programs print
    kind: process
    task: 47
    rulings_md: "CCE 21's defaultmap family is a wrong answer, not a host fallback: the region runs on the device and the map(tofrom) ran_on_host flag is not copied back (5.2 §5.8.3 p.154 exit step 1a)"
    citations:
      - {version: "5.2", section: "5.8.3", page: 154,
         quote: "map-type-modifier is specified, and if the map-type is from or tofrom, the original list item is updated as if the list item appeared in a from clause on a target update directive."}
    # a correction (data/vendor/errata-for-findings.md): CRAY_ACC_DEBUG shows
    # the kernel and an array flag mapped from in the same region returns 0
    # (vendor case cce21-defaultmap-device-probe); the catalog's
    # fell_back_to_host cells of the family rest on the lost scalar
