    observable: "x%c1 = 101, x%c2 = 0; the region copies x%c1 to rd and sets x%c2 = 2*x%c1 + 1: rd = 101 and x%c2 = 203 on the host"
    template: struct_rw
    spec:
      - {version: "OpenMP 5.0", section: "2.19.7", page: 315, lines: "5-6", quote: "If a variable is not a scalar then it is treated as if it had appeared in a map clause with a map-type of tofrom"}
      - {version: "OpenMP 5.2", section: "5.8.1", page: 148, lines: "6-7", quote: "References to structure elements or array elements are treated as references to the structure or array"}
      - {version: "OpenMP 5.2", section: "5.8.1", page: 149, lines: "4-5", quote: "If a variable is not a scalar then it is treated as if it had appeared in a map clause with a map-type of tofrom"}
      - {version: "OpenMP 6.0", section: "7.9.3", page: 276, lines: "8-9", quote: "References to structure elements or array elements are treated as references to the structure or array"}
