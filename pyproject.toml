[build-system]
# hatchling 1.27: license-files (PEP 639); hatch-vcs: the version from the git tag;
# pyyaml: the build hook (hatch_build.py) builds the bundled data with offload's own code
requires = ["hatchling>=1.27", "hatch-vcs", "pyyaml"]
build-backend = "hatchling.build"

[project]
name = "offtarget"
# the version is the git tag (vX.Y.Z), read at build time by hatch-vcs; a release is a pushed tag
# (.github/workflows/release.yml). offload.__version__ reads it back.
dynamic = ["version"]
description = "Known OpenMP and OpenACC offload compiler problems: look up support, search issues"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Spencer H. Bryngelson" }]
keywords = ["openmp", "openacc", "gpu", "offload", "compiler", "fortran"]
dependencies = ["pyyaml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Fortran",
    "Programming Language :: C",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Compilers",
]

[project.scripts]
offload = "offload.cli:main"

[project.urls]
Homepage = "https://sbryngelson.github.io/offtarget/"
Repository = "https://github.com/sbryngelson/offtarget"
Issues = "https://github.com/sbryngelson/offtarget/issues"

[tool.hatch.version]
source = "vcs"
# PyPI refuses local versions ("+gHASH"): an untagged build is X.Y.Z.devN
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "offload/_version.py"

# the sdist holds what the wheel build reads (offload/_bundle.py, tools/repo/bundle_manifest.txt), nothing more;
# tests/test_offload.py builds the wheel from it and compares
[tool.hatch.build.targets.sdist]
include = [
    "/offload",
    "/hatch_build.py",
    "/README.md",
    "/THIRD_PARTY_NOTICES.md",
    "/tools/repo/bundle_manifest.txt",
    "/catalog/acc",
    "/catalog/omp",
    "/catalog/later_forms.yaml",
    "/catalog/machines.yaml",
    "/catalog/toolchains.yaml",
    "/catalog/vendor_claims_generic.yaml",
    "/data/findings",
    "/data/vendor/checks/build.py",
    "/data/vendor/checks/cases.json",
    "/data/vendor/checks/cases-site.json",
    "/data/vendor/checks/results-compact",
    "/data/vendor/checks/results-site",
    "/data/vendor/checks/run_checks.py",
    "/data/vendor/checks/src",
    "/site/inputs",
]
exclude = ["/data/findings/proposed"]

[tool.hatch.build.targets.wheel]
packages = ["offload"]
# the package's READMEs describe the source tree; the wheel carries code and offload/_root only
exclude = ["README.md"]

# copies the data an installed offload needs into offload/_root (offload/_bundle.py)
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
markers = [
    "gpu: needs the GPU on this node (runs by default)",
    "gfortran: runs the gfortran base-language checker (runs by default)",
    "slow: builds the site data or the bundle, installs the package, or checks the committed data against measurements (runs by default; -m \"not slow\" leaves them out)",
]
