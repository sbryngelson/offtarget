     cite: "5.0 §1.2.6 p.12", finding: data/findings/afar-cce19-character-defaultmap.f90,
     withdraw: [afar, cce19, cce20]}
  - {version: 52, program: omp52-clause-defaultmap-character, disposition: compiler_wrong,
     cite: "5.2 §1.2.6 p.14, §5.8.1 p.148", finding: data/findings/afar-cce19-character-defaultmap.f90,
     withdraw: [afar, cce19, cce20]}
  - {version: 60, program: omp60-clause-defaultmap-character, disposition: compiler_wrong,
