  - id: D7-cce-target-simd-lastprivate-conditional
    match: {cases: ["fuzz:s1:3603:cce19:gfx942:unified",
              "fuzz:s1:3603:cce20:gfx942:unified",
              "fuzz:s1:3603:cce21:gfx942:unified",
              "fuzz:s1:7038:cce21:gfx942:unified",
