    notes: "5.0 and 5.1 restrict the distribute parallel worksharing-loop construct: 'No linear clause can be specified.' 5.2 allows linear when distribute is a constituent, for loop iteration variables only (§17.5). The restriction applies to the compounds that contain it (distribute parallel do). TableGen allows linear at every version."
