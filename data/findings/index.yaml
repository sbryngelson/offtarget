# The machine-readable findings index (offload/engine/confirm/
# findings.py). One entry per hand-written finding of data/findings/
# (README.md tables); the minimized fuzz findings (data/findings/fuzz/)
# are read from their file headers and need no entry. Keys: file;
# toolchains (gfx942 names: the compilers the finding shows wrong; a
# gfx90a twin is the same compiler); lang (f90 | c); outcome (the class:
# ice, rejected, timeout, crash, run_error, wrong_answer,
# fell_back_to_host); message (a normalized compiler or runtime message,
# for compile-time and crash findings); modes (unified, copy); arch
# (modes and arch are the recorded scope extended by every
# (mode, arch) where a stored failing catalog or omp_vv cell instance-links
# the finding, `tools/confirm.py index --scope --write`; a test fails when
# a linked cell is outside them);
# expected (the stated output, for a run of the file; optional); scope
# (device | host+device | out_of_scope); programs (fnmatch patterns of
# catalog programs the finding explains, from README.md,
# catalog/mode_differences.yaml and catalog/expected_triage.yaml);
# constructs (the key constructs of a run-time failure, for signatures;
# default: those of the file minus target and map); sites (fix
# The ICE's compiler-source site per compiler release, as
# recorded in README.md; a release without one gives "related" matches,
# never duplicates).
findings:
  - file: afar-cce19-character-defaultmap.f90
    toolchains: [afar, cce19, cce20]
    lang: f90
    outcome: wrong_answer
    modes: [unified, copy]
    arch: [gfx942, gfx90a]
    expected: "ch=b s=wxyz k=1"
    programs: ["omp*-clause-defaultmap-character*"]
    constructs: ["clause:defaultmap"]
