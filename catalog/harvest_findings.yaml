# What the harvest's confirmed failures became (read by
# tools/campaigns/harvest.py report). new: a finding promoted to data/findings/harvest/
# (index entry and README row); linked: an existing finding the harvested
# tests reproduce (with what the harvest adds); unsupported: the vendor
# documents the construct or routine as unsupported (recorded, never a
# finding); candidate: confirmed by the gate, not promoted (the reason says
# what is missing). Holdout programs are counted, never named.
new:
- file: harvest/cce-c-strided-target-update.c
  upstream:
  - the 25 non-holdout tests of llvm/offloading/strided_update/
  note: the CCE man page claims strided (non-contiguous) updates
- file: harvest/afar-flang-strided-target-update.f90
  upstream: []
  note: found while reducing the C strided-update failures (no Fortran strided-update test upstream);
    CCE and NVHPC reject the stride; gate confirmed on gfx942 X0 (four environments); legal by the
    quoted spec text only (no independent compiler witness)
- file: harvest/cce-ftn-target-parallel-thread-query-ice.f90
  upstream:
  - llvm/offloading/fortran/basic-target-parallel-region.f90
  - aomp/smoke/flang-313307-simple-spmd
  note: an ICE on a basic upstream test; CCE documents both routines as supported in offload regions
linked:
- finding: afar-c-teams-distribute-reduction-first-team.c
  upstream:
  - llvm/offloading/xteam_reduction_no_parallel.c
  note: 'Found it the same day; the harvest adds the upstream fix: llvm-project 2c1650555b10 (#231843,
    2026-10-14), after the AFAR drop'
- finding: catalog/afar-flang-absent-optional-target-crash.f90
  upstream:
  - llvm/offloading/fortran/optional-mapped-arguments.f90
  note: 'the harvest test crashes AFAR (SIGSEGV); a target region with map(tofrom: a) of the absent dummy
    aborts (device allocation of a garbage size), the absent dummy in target data, enter data and exit
    data does not'
- finding: catalog/cce-c-ordered-link.c
  upstream:
  - llvm/offloading/schedule.c
  note: 'maintainer ruling 2026-10-28: a construct CCE does not support in offload regions that compiles and then
    fails at device link (__kmpc_dispatch_init_4) is a defect, not a documented gap'
unsupported:
- what: 'CCE C and Fortran: omp_get_level, omp_get_active_level, omp_get_ancestor_thread_num, omp_get_team_size,
    omp_get_max_active_levels, omp_in_final, omp_get_supported_active_levels in a target region: device
    link fails (undefined symbol)'
  doc: 'CCE intro_openmp (19.0.0, 20.0.2, 21.0.3): in offload regions only omp_is_initial_device, omp_get_thread_num,
    omp_get_num_threads, omp_get_team_num and omp_get_num_teams are supported'
  upstream:
  - llvm/offloading/thread_state_1.c
