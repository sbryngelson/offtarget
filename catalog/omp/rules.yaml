        text: "Neither a stand-alone directive nor a declarative directive may be used in place of a substatement in a selection statement or iteration statement, or in place of the statement that follows a label."

  - id: canonical-loop-001
    lang: c
    check: static
    status: provisional
    predicate: c_loop_increment_direction_var_left
    example: "#pragma omp parallel for / for (i = 0; i < n; i--)"
    notes: "Also the second sentence of the bullet (var relational-op b with > or >=: var must decrease). Checked when the step is an integer literal. Isolation: decrement in a for loop whose test is i <= n."
    spec:
      50:
        citation: "OpenMP 5.0 §2.9.1, p.100"
        text: "If test-expr is of the form var relational-op b and relational-op is < or <= then incr-expr must cause var to increase on each iteration of the loop."
      52:
        citation: "OpenMP 5.2 §4.4.1, p.90"
        text: "If test-expr is of the form var relational-op b and relational-op is < or <= then incr-expr must cause var to increase on each iteration of the loop."
