# --- runtime (not decidable from the source) ---------------------------------------------

  - id: distribute-exec-001
    check: runtime
    status: provisional
    predicate: null
    why: "The iteration space depends on loop bounds evaluated at run time in each team."
    spec:
      50:
        citation: "OpenMP 5.0 §2.9.4.1, p.122"
        text: "The distribute construct inherits the restrictions of the worksharing-loop construct."
        also: ["OpenMP 5.0 §2.9.2, p.107"]
      52:
        citation: "OpenMP 5.2 §11.6, p.255"
        text: "The logical iteration space of the loops associated with the distribute construct must be the same for all teams in the league."
      60:
        citation: "OpenMP 6.0 §13.7, p.421"
        text: "The collapsed iteration space must the same for all teams in the league."

  - id: distschedule-exec-001
    check: runtime
    status: provisional
    predicate: null
    why: "chunk_size is an expression whose value per team is known only at run time."
    spec:
      50:
        citation: "OpenMP 5.0 §2.9.2, p.107"
        text: "The value of the chunk_size expression must be the same for all threads in the team."
        also: ["OpenMP 5.0 §2.9.4.1, p.122"]
      52:
        citation: "OpenMP 5.2 §11.6.1, p.256"
        text: "The value of the chunk_size expression must be the same for all teams in the league."
      60:
        citation: "OpenMP 6.0 §13.7.1, p.423"
        text: "The value of the chunk_size expression must be the same for all teams in the league."

  - id: do-exec-001
    check: runtime
    status: provisional
    predicate: null
    why: "The iteration space depends on loop bounds evaluated at run time by each thread."
    spec:
      50:
        citation: "OpenMP 5.0 §2.9.2, p.107"
        text: "The values of the loop control expressions of the loops associated with the worksharing-loop construct must be the same for all threads in the team."
      52:
        citation: "OpenMP 5.2 §11.5, p.249"
        text: "The logical iteration space of the loops associated with the worksharing-loop construct must be the same for all threads in the team."
      60:
        citation: "OpenMP 6.0 §13.6, p.415"
        text: "The collapsed iteration space must be the same for all threads in the team."

  - id: loop-exec-001
    check: runtime
    status: provisional
    predicate: null
    why: "Which threads encounter a loop region depends on control flow at run time."
    spec:
      50:
        citation: "OpenMP 5.0 §2.9.5, p.131"
        text: "If a loop region binds to a teams or parallel region, it must be encountered by all threads in the binding thread set or by none of them."
      52:
        citation: "OpenMP 5.2 §11.7, p.258"
        text: "If a loop region binds to a teams or parallel region, it must be encountered by all threads in the binding thread set or by none of them."
      60:
        citation: "OpenMP 6.0 §13.8, p.424"
        text: "If a loop region binds to a teams region or parallel region, it must be encountered by all threads in the binding thread set or by none of them."

  - id: device-exec-001
    check: runtime
    status: provisional
    predicate: null
    why: "The device number is a run-time value and the set of conforming device numbers is known only at run time."
    spec:
      50:
        citation: "OpenMP 5.0 §2.12.5, p.174"
        text: "The device clause expression must evaluate to a non-negative integer value less than the value of omp_get_num_devices() or to the value of omp_get_initial_device()."
      52:
        citation: "OpenMP 5.2 §13.2, p.276"
        text: "If the device_num device-modifier is specified and target-offload-var is not mandatory, device-description must evaluate to a conforming device number."
      60:
        citation: "OpenMP 6.0 §15.2, p.452"
        text: "If the device_num device-modifier is specified and target-offload-var is not mandatory, device-description must evaluate to a conforming device number."

  - id: map-exec-001
    check: runtime
    status: provisional
    predicate: null
    why: "What is present in the device data environment when the construct is encountered depends on earlier executions."
    spec:
      50:
        citation: "OpenMP 5.0 §2.19.7.1, p.322"
        text: "If any part of the original storage of a list item with an explicit data-mapping attribute has corresponding storage in the device data environment prior to a task encountering the construct associated with the map clause, all of the original storage must have corresponding storage in the device data environment prior to the task encountering the construct."
      52:
        citation: "OpenMP 5.2 §5.8.3, p.156"
        text: "If any part of the original storage of a list item with an explicit data-mapping attribute has corresponding storage in the device data environment prior to a task encountering the construct associated with the map clause, all of the original storage must have corresponding storage in the device data environment prior to the task encountering the construct."
      60:
        citation: "OpenMP 6.0 §7.9.6, p.286"
        text: "If any part of the original storage of a list item that is explicitly mapped by a map clause has corresponding storage in the device data environment prior to a task encountering the construct associated with the map clause, all of the original storage must have corresponding storage in the device data environment prior to the task encountering the construct."

  - id: target-exec-001
    lang: f90
    check: runtime
    status: provisional
    predicate: null
    why: "Allocation status on entry to and exit from the region is a run-time property."
    spec:
      50:
        citation: "OpenMP 5.0 §2.19.7.1, p.323"
        text: "If the allocation status of a list item or any subobject of the list item with the ALLOCATABLE attribute is unallocated upon entry to a target region, the list item or any subobject of the corresponding list item must be unallocated upon exit from the region."
      52:
        citation: "OpenMP 5.2 §13.8, p.287"
        text: "If the allocation status of a mapped variable that has the ALLOCATABLE attribute is unallocated on entry to a target region, the allocation status of the corresponding variable in the device data environment must be unallocated upon exiting the region."
      60:
        citation: "OpenMP 6.0 §15.8, p.464"
        text: "If the allocation status of a mapped variable or a list item that appears in a has_device_addr clause that has the ALLOCATABLE attribute is unallocated on entry to a target region, the allocation status of the corresponding variable in the device data environment must be unallocated upon exiting the region."

