  - id: typebound-declaretarget-001
    lang: f90
    check: static
    status: provisional
    predicate: type_bound_declare_target
    example: "type t ... procedure :: get => t_get ... (t_get without declare target) ... !$omp target / r = x%get() / !$omp end target"
    notes: "Accessed: a binding reference (call x%b, x%b(...)), the specifics of a generic binding, a defined assignment or operator of the type, a final subroutine of a local or INTENT(OUT) object of a device procedure, and the defined assignment (firstprivate) and final subroutines (private, firstprivate) of a target construct's list items. A polymorphic object may invoke every override in an extension. In the region: target constructs and the procedures that run on the device (declare target, referenced from the region, reached as a type-bound procedure). A binding whose procedure is not defined in the source is not judged. The sentence is part of the definition of a mappable type: a list item must have a mappable type (5.2 §5.8.3 p.156). Conservative (it may refuse a conforming program; none in the corpus): a CLASS object needs every override in every extension the source defines, used on the device or not; a derived-type dummy declared without INTENT is read as a finalized local; a procedure also referenced by name in the region (implicitly declare target, 5.2 §13.8 p.285) is still refused when it is accessed as a binding."
    spec:
      50:
        citation: "OpenMP 5.0 §1.2.6, p.16"
        text: "All type-bound procedures accessed in any target region must appear in a declare target directive."
      52:
        citation: "OpenMP 5.2 §1.2.6, p.19"
        text: "All type-bound procedures accessed in any target region must appear in a declare target directive."
        also: ["OpenMP 5.2 §5.8.3, p.156"]
      60:
        citation: "OpenMP 6.0 §2, p.69"
        text: "All type-bound procedures accessed in any target region must appear in a declare_target directive."
        also: ["OpenMP 6.0 §7.9.6, p.287"]

