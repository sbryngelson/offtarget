    verdict: compiler_bug
    basis: >-
      A deterministic crash or runtime abort (signal, memory access fault,
      heap corruption, an offload runtime error) of a legal program that
      passed the definedness check (the sequential program with
      -fcheck=all, twice, prints the model value), while a toolchain of the
      other compiler family runs the same program to the model's value on
      the device in the same memory mode. No expected value is needed to
      call a crash a failure; the other family's run shows the program is
      executable as written (the metamorphic rewrites did not give a second
      source, so the rules stop at R22). A presence or overlap abort
      (CRAY_ACC "Variable not found in present table", "Host region
      overlaps present region", an offload "not present" error) is
      witnessed only by a CCE toolchain or by AFAR at HSA_XNACK=0 (copy
      mode): AFAR at HSA_XNACK=1 does not enforce the present check
      (data/findings/afar-xnack1-present-not-enforced.f90), so its correct run
      says nothing about the mapping (s1 seeds 7986
      and 9270 leave the decision, seed 2232 CCE 21 joins it by AFAR's
      copy-mode run).

