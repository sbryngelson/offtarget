# What a scorer of data/bench/harvest2-holdout reads beside the seal. The sealed files
# are not changed; this file is outside the seal. Sealed ids only.
#
# excluded: never scored. Each case's code or provenance can be read from dev material:
#   - exposed_history: the case was a dev program (its code, upstream source and pre-run verdict at a dev path,
#     under its dev id) in this branch's first cut (by text), committed and pushed for about 13 hours before the
#     split was redone by code; the implementer had also seen the hand programs' NVHPC compile results and the
#     rules-witness verdicts of that cut. The history was rebuilt without it, but it was readable.
#   - near_copy: a dev program has shingle Jaccard >= 0.9 with the case (the measure); its dev rows
#     predict the case's labels. The similar lists are top-5 and one-directional, so this is a lower bound.
# scored_modes: copy only (the rule for the 49a harvest, applied here): AMD HSA_XNACK=0
#   and NVHPC separate memory. Unified (HSA_XNACK=1) and managed rows stay in outcomes.csv and are not scored: the
#   copy-only list (catalog/harvest2_copy_only.yaml) covers dev programs only, and many upstream tests assume
#   separate host and device storage.
# not_run: every MI250X (Tioga, *_g90) cell is not_run by design: the holdout was never copied to Tioga. The seal
#   allows missing cells on Tioga only (tools/campaigns/harvest.py seal --allow-missing-machine tioga).
# outcomes: outcomes.csv's `outcome` column is offload.engine.gate.outcome_class of the cell (correct_on_device,
#   wrong_answer, crash, run_error, timeout, rejected, ice, accepted_ignored, fell_back_to_host, harness_error),
#   plus refused (the pre-run check refused the program), not_applicable (a mode the program's expected result
#   does not hold in, or a model the toolchain does not compile: OpenACC on AFAR, C OpenACC on CCE) and not_run.
#   The `gate` column holds the gate's verdict for a failing row (confirmed, nondeterministic, environment,
#   not_reproduced). Treat harness_error as no label, refused, not_applicable and not_run as not scored, and a
#   failing row as a failure only when gate is confirmed.
# gate_environments: the gate column of outcomes.csv was sealed when the AMD gates (Tuolumne) had run (c),
#   "another node", on (a)'s node: an AMD verdict there rests on three environments (a, b, d). (c) was rerun on
#   other compute nodes afterwards (results/harvest2/main, not in the seal); wingtip's (c) ran on another GPU.
#   A scorer that needs four-environment AMD verdicts re-derives them from results/harvest2 (offload.engine.gate).
# grounds: near_copy_only lists the near copies not already in exposed_history (30 of the 41 near copies are).
