      - since: 34
        citation: "OpenACC 3.4 §2.12, p.77"
        syntax: "none"

  use_device:
    status: provisional
    forms:
      - since: 34
        citation: "OpenACC 3.4 §2.8.1, p.63"
        syntax: "list"

  vector:
    status: provisional
    forms:
      - since: 34
        citation: "OpenACC 3.4 §2.9.4, p.68"
        syntax: "none | enum[length] ':' expr | expr@length"
      - since: 34
        directives: [routine]
        citation: "OpenACC 3.4 §2.15.1, p.91"
        syntax: "none"

  vector_length:
    status: provisional
    forms:
      - since: 34
        citation: "OpenACC 3.4 §2.5.12, p.38"
        syntax: "expr"

  wait:
    status: provisional
    notes: "wait-argument: [devnum : int-expr :] [queues :] async-argument-list (3.4 §2.16, p.98)."
    forms:
      - since: 34
        citation: "OpenACC 3.4 §2.16.2, p.100"
        syntax: "none | [enum[devnum] ':' expr ':'] [enum[queues] ':'] expr_list"

  worker:
    status: provisional
    forms:
      - since: 34
        citation: "OpenACC 3.4 §2.9.3, p.68"
        syntax: "none | enum[num] ':' expr | expr@num"
      - since: 34
        directives: [routine]
        citation: "OpenACC 3.4 §2.15.1, p.91"
        syntax: "none"

  write:
    status: provisional
    forms:
      - since: 34
        citation: "OpenACC 3.4 §2.12, p.77"
        syntax: "none"
