# Restriction rules for the first slice (OpenMP, Fortran, target offload).
#
# Layer 3 of the catalog: restrictions the context-free clause grammar does
# not express. Read by offload/engine/rules.py (load_rules); the schema is in that
# module's docstring. In short, each entry is
#   id         <construct-or-topic>-<kind>-<nnn>; the rule id of version V is
#              OMP<V>-<id> (OMP52-teams-nesting-001)
#              (versions 50, 52, 60; a rule without a 50 entry has no 5.0
#              counterpart, see docs/tooling/omp5-vs-52.md)
#   check      static (decidable from the source text) or runtime (not; `why`
#              says why)
#   status     provisional until the project owner reviews it
#   predicate  a function in offload/engine/rules.py (null for runtime rules)
#   example    a small illegal example, for the review document
#   notes      context: what a single-change illegal variant needs so that
#              only this rule fires (for the generator), and any narrowing
#   spec       per version: the citation ("OpenMP <ver> §<sec>, p.<n>", the
#              printed page where the sentence starts), the spec sentence
#              verbatim, and optional `also` citations
#   lang       optional: f90 or c when the rule holds in one
#              language only (a Fortran-only sentence or construct, or a
#              C/C++ sentence); absent: both (offload.engine.rules.Rule.lang)
# Kinds: nesting, placement, loop, map, dsa, clause, storage, body, exec
# (runtime).
# The inventory of every restriction sentence of the slice and the rules added for it
# is in catalog/omp/rules_coverage.yaml.

rules:

# --- nesting and placement --------------------------------------------------------

  - id: teams-nesting-001
    check: static
    status: provisional
    predicate: teams_strictly_nested_in_target
    example: "!$omp parallel / !$omp teams / ... / !$omp end teams / !$omp end parallel"
    notes: "Isolation: enclose a teams construct in a parallel (or target data) construct, not inside a target; the teams body holds only statements."
    spec:
      50:
        citation: "OpenMP 5.0 §2.7, p.85"
        text: "A teams region can only be strictly nested within the implicit parallel region or a target region."
      52:
        citation: "OpenMP 5.2 §10.2, p.232"
        text: "A teams region must be strictly nested within the implicit parallel region that surrounds the whole OpenMP program or a target region."
      60:
        citation: "OpenMP 6.0 §12.2, p.395"
        text: "A teams region must be a strictly nested region of the implicit parallel region that surrounds the whole OpenMP program or a target region."

  - id: teams-nesting-002
    check: static
    status: provisional
    predicate: target_contains_only_teams
    example: "!$omp target / x = 1 / !$omp teams / ... / !$omp end teams / !$omp end target"
    notes: "Isolation: add one statement inside a target construct next to its only nested teams construct."
    spec:
      50:
        citation: "OpenMP 5.0 §2.7, p.85"
        text: "If a teams construct is nested within a target construct, that target construct must contain no statements, declarations or directives outside of the teams construct."
      52:
        citation: "OpenMP 5.2 §10.2, p.232"
        text: "If a teams region is nested inside a target region, the corresponding target construct must not contain any statements, declarations or directives outside of the corresponding teams construct."
      60:
        citation: "OpenMP 6.0 §12.2, p.395"
        text: "If a teams region is nested inside a target region, the corresponding target construct must not contain any statements, declarations or directives outside of the corresponding teams construct."

  - id: teams-nesting-003
    check: static
    status: provisional
    predicate: teams_nested_regions
    example: "!$omp teams / !$omp task / ... / !$omp end task / !$omp end teams"
    notes: "Isolation: put a task (or single) construct directly in a teams construct that is not nested in a target. A device construct (target update) in a target teams construct also fires target-nesting-001; use a non-device construct."
    spec:
      50:
        citation: "OpenMP 5.0 §2.7, p.85"
        text: "distribute, distribute simd, distribute parallel worksharing-loop, distribute parallel worksharing-loop SIMD, parallel regions, including any parallel regions arising from combined constructs, omp_get_num_teams() regions, and omp_get_team_num() regions are the only OpenMP regions that may be strictly nested inside the teams region."
        also: ["OpenMP 5.0 §2.13.15, p.202", "OpenMP 5.0 §2.9.5, p.131"]
      52:
        citation: "OpenMP 5.2 §10.2, p.232"
        text: "distribute regions, including any distribute regions arising from composite constructs, parallel regions, including any parallel regions arising from combined constructs, loop regions, omp_get_num_teams() regions, and omp_get_team_num() regions are the only OpenMP regions that may be strictly nested inside the teams region."
      60:
        citation: "OpenMP 6.0 §12.2, p.396"
        text: "Only regions that are generated by teams-nestable constructs or teams-nestable routines may be strictly nested regions of teams regions."
        also: ["OpenMP 6.0 §12.1, p.384", "OpenMP 6.0 §13.7, p.420", "OpenMP 6.0 §13.8, p.423"]

  - id: distribute-nesting-001
    check: static
    status: provisional
    predicate: distribute_strictly_nested_in_teams
    example: "!$omp parallel / !$omp distribute / do ... / !$omp end parallel"
    notes: "Isolation: put the distribute in a parallel construct (not in teams). An orphaned distribute is never flagged."
    spec:
      50:
        citation: "OpenMP 5.0 §2.9.4.1, p.123"
        text: "The region corresponding to the distribute construct must be strictly nested inside a teams region."
      52:
        citation: "OpenMP 5.2 §11.6, p.255"
        text: "The region that corresponds to the distribute construct must be strictly nested inside a teams region."
      60:
        citation: "OpenMP 6.0 §13.7, p.421"
        text: "The region that corresponds to the distribute construct must be a strictly nested region of a teams region."

  - id: loop-nesting-001
    check: static
    status: provisional
    predicate: loop_orphan_has_bind
    example: "!$omp loop / do ... (not nested in any construct, no bind clause)"
    notes: "Isolation: an orphaned loop directive (not inside any construct) without bind; keep lastprivate off or on the loop variable."
    spec:
      50:
        citation: "OpenMP 5.0 §2.9.5, p.131"
        text: "If a loop construct is not nested inside another OpenMP construct and it appears in a procedure, the bind clause must be present."
      52:
        citation: "OpenMP 5.2 §11.7, p.258"
        text: "If a loop construct is not nested inside another OpenMP construct then the bind clause must be present."
      60:
        citation: "OpenMP 6.0 §13.8, p.424"
        text: "If a loop construct is not nested inside another construct then the bind clause must be present."

  - id: loop-nesting-002
    check: static
    status: provisional
    predicate: loop_bind_teams_in_teams
    example: "!$omp parallel / !$omp loop bind(teams) / do ... / !$omp end parallel"
    notes: "Isolation: loop bind(teams) directly inside a parallel construct. An orphaned loop bind(teams) is never flagged."
    spec:
      50:
        citation: "OpenMP 5.0 §2.9.5, p.131"
        text: "If the bind clause is present and binding is teams, the loop region corresponding to the loop construct must be strictly nested inside a teams region."
      52:
        citation: "OpenMP 5.2 §11.7.1, p.259"
        text: "If teams is specified as binding then the corresponding loop region must be strictly nested inside a teams region."
      60:
        citation: "OpenMP 6.0 §13.8.1, p.425"
        text: "If teams is specified as binding then the corresponding loop region must be a strictly nested region of a teams region."

  - id: target-nesting-001
    check: static
    status: provisional
    predicate: device_construct_in_target
    example: "!$omp target / !$omp target update to(a) / !$omp end target"
    notes: "Isolation: target update (or target data, enter/exit data) inside a bare target construct. Inside target teams it also fires teams-nesting-003."
    spec:
      50:
        citation: "OpenMP 5.0 §2.12.5, p.174"
        text: "If a target update, target data, target enter data, or target exit data construct is encountered during execution of a target region, the behavior is unspecified."
        also: ["OpenMP 5.0 §2.20, p.329"]
      52:
        citation: "OpenMP 5.2 §13.8, p.286"
        text: "Device-affecting constructs, other than target constructs for which the ancestor device-modifier is specified, must not be encountered during execution of a target region."
      60:
        citation: "OpenMP 6.0 §15.8, p.462"
        text: "Device-affecting constructs, other than target constructs for which the ancestor device-modifier is specified, must not be encountered during execution of a target region."

  - id: order-nesting-001
    check: static
    status: provisional
    predicate: order_concurrent_nesting
    example: "!$omp parallel do order(concurrent) / do ... / !$omp task / ... / !$omp end task / end do"
    notes: "Isolation: a task construct in the loop body of parallel do order(concurrent)."
    spec:
      50:
        citation: "OpenMP 5.0 §2.9.2, p.108"
        text: "If an order(concurrent) clause is present, all restrictions from the loop construct with an order(concurrent) clause also apply."
        also: ["OpenMP 5.0 §2.9.5, p.131", "OpenMP 5.0 §2.9.3.1, p.113"]
      52:
        citation: "OpenMP 5.2 §10.3, p.234"
        text: "The only constructs that may be encountered inside a region that corresponds to a construct with an order clause that specifies concurrent are the loop construct, the parallel construct, the simd construct, and combined constructs for which the first construct is a parallel construct."
      60:
        citation: "OpenMP 6.0 §12.3, p.398"
        text: "Only regions that correspond to order-concurrent-nestable constructs or order-concurrent-nestable routines may be strictly nested regions of regions that correspond to constructs on which the order clause is specified with concurrent as the ordering argument."
        also: ["OpenMP 6.0 §12.1, p.384", "OpenMP 6.0 §12.4, p.399", "OpenMP 6.0 §13.8, p.423", "OpenMP 6.0 §17.8.5, p.494"]

  - id: declaretarget-placement-001
    lang: f90
    check: static
    status: provisional
    predicate: declare_target_in_specification_part
    example: "!$omp target / !$omp declare target (a) / ... / !$omp end target"
    notes: "Isolation: declare target (a) inside a parallel or target construct (not in teams)."
    spec:
      50:
        citation: "OpenMP 5.0 §2.12.7, p.184"
        text: "Any declare target directive with clauses must appear in a specification part of a subroutine subprogram, function subprogram, program or module."
      52:
        citation: "OpenMP 5.2 §7.8.1, p.206"
        text: "If an extended list item is a variable name, the directive must appear in the specification part of a subroutine subprogram, function subprogram, program or module."
        also: ["OpenMP 5.2 §7.8.1, p.206"]
      60:
        citation: "OpenMP 6.0 §9.9.1, p.348"
        text: "If a list item in extended-list is a variable, the directive must appear in the specification part in which the variable is declared."
        also: ["OpenMP 6.0 §9.9.1, p.348"]

  - id: requires-placement-001
    lang: f90
    check: static
    status: provisional
    predicate: requires_in_specification_part
    example: "!$omp parallel / !$omp requires atomic_default_mem_order(seq_cst) / !$omp end parallel"
    notes: "Isolation: requires atomic_default_mem_order(...) inside a parallel construct. At 5.2 a requires with unified_shared_memory, unified_address or reverse_offload inside a target also fires requires-placement-002."
    spec:
      50:
        citation: "OpenMP 5.0 §1.2.2, p.3"
        text: "An OpenMP directive that may only be placed in a declarative context."
        also: ["OpenMP 5.0 §2.4, p.60"]
      52:
        citation: "OpenMP 5.2 §8.2, p.211"
        text: "The requires directive must appear in the specification part of a program unit, after any USE statement, any IMPORT statement, and any IMPLICIT statement, unless the directive appears by referencing a module and each clause already appeared with the same arguments in the specification part of the program unit."
      60:
        citation: "OpenMP 6.0 §10.5, p.356"
        text: "The requires directive must appear in the specification part of a program unit, either after all USE statements, IMPORT statements, and IMPLICIT statements or by referencing a module."

  - id: requires-placement-002
    check: static
    status: provisional
    predicate: requires_before_device_constructs
    example: "!$omp target / ... / !$omp end target / !$omp requires unified_shared_memory"
    notes: "Isolation: a requires unified_shared_memory at the top of the program unit, after a complete target construct, not nested in a construct (nested also fires requires-placement-001)."
    spec:
      50:
        citation: "OpenMP 5.0 §2.4, p.63"
        text: "A requires directive with a unified_address, unified_shared_memory, or reverse_offload clause must appear lexically before any device constructs or device routines."
      52:
        citation: "OpenMP 5.2 §8.2, p.211"
        text: "Any requires directive that specifies a reverse_offload, unified_address, or unified_shared_memory requirement must appear lexically before any device constructs or device routines."

# --- loop association --------------------------------------------------------------

  - id: assoc-loop-001
    check: static
    status: provisional
    predicate: loop_nest_follows
    example: "!$omp parallel do / x = 1"
    notes: "Isolation: replace the DO loop after a loop directive by a plain statement (and drop its end directive)."
    spec:
      50:
        citation: "OpenMP 5.0 §2.9.2, p.102"
        text: "Specifically, all associated do-loops must have canonical loop form (see Section 2.9.1 on page 95)."
        also: ["OpenMP 5.0 §1.2.3, p.8"]
      52:
        citation: "OpenMP 5.2 §3.1, p.52"
        text: "Loop-associated directives are block-associated directives for which the associated structured-block is loop-nest, a canonical loop nest."
      60:
        citation: "OpenMP 6.0 §5.1, p.153"
        text: "Loop-nest-associated directives are block-associated directives for which the associated structured-block is loop-nest, a canonical loop nest."

  - id: collapse-loop-001
    check: static
    status: provisional
    predicate: collapse_within_depth
    example: "!$omp parallel do collapse(2) / do i = 1, n / ... / end do (a single loop)"
    notes: "Isolation: collapse(n) with n one more than the DO nest depth; no loop-transforming directive inside the nest (depth unknown, never flagged)."
    spec:
      50:
        citation: "OpenMP 5.0 §2.9.2, p.104"
        text: "If the value of the parameter in the collapse or ordered clause is larger than the number of nested loops following the construct, the behavior is unspecified."
        also: ["OpenMP 5.0 §2.9.2, p.107"]
      52:
        citation: "OpenMP 5.2 §4.4.3, p.93"
        text: "n must not evaluate to a value greater than the depth of the associated loop nest."
      60:
        citation: "OpenMP 6.0 §6.4.5, p.206"
        text: "n must not evaluate to a value greater than the loop nest depth."

  - id: loop-dsa-001
    check: static
    status: provisional
    predicate: loop_lastprivate_iteration_variable
    example: "!$omp loop bind(thread) lastprivate(x) / do i = 1, n / ..."
    notes: "Isolation: lastprivate of a non-loop variable on a loop construct with bind (or nested in teams/parallel)."
    spec:
      50:
        citation: "OpenMP 5.0 §2.9.5, p.131"
        text: "A list item may not appear in a lastprivate clause unless it is the loop iteration variable of a loop that is associated with the construct."
      52:
        citation: "OpenMP 5.2 §11.7, p.257"
        text: "A list item may not appear in a lastprivate clause unless it is the loop iteration variable of a loop that is associated with the construct."
      60:
        citation: "OpenMP 6.0 §13.8, p.424"
        text: "A list item must not appear in a lastprivate clause unless it is the loop-iteration variable of an affected loop."

# --- data mapping --------------------------------------------------------------------

  - id: target-map-001
    check: static
    status: provisional
    predicate: target_map_types
    example: "!$omp target map(release: a)"
    notes: "Isolation (5.2): map(release: a) or map(delete: a) on target or a target compound."
    spec:
      50:
        citation: "OpenMP 5.0 §2.12.5, p.174"
        text: "A map-type in a map clause must be to, from, tofrom or alloc."
      52:
        citation: "OpenMP 5.2 §13.8, p.286"
        text: "A map-type in a map clause must be to, from, tofrom or alloc."

  - id: targetdata-map-001
    check: static
    status: provisional
    predicate: target_data_map_types
    example: "!$omp target data map(delete: a)"
    notes: "Isolation (5.2): map(release: a) or map(delete: a) on target data."
    spec:
      50:
        citation: "OpenMP 5.0 §2.12.2, p.163"
        text: "A map-type in a map clause must be to, from, tofrom or alloc."
      52:
        citation: "OpenMP 5.2 §13.5, p.280"
        text: "A map-type in a map clause must be to, from, tofrom or alloc."

  - id: targetenterdata-map-001
    check: static
    status: provisional
    predicate: enter_data_map_entering
    example: "!$omp target enter data map(from: a)"
    notes: "Isolation: map(from: a) (5.2 also release/delete; 6.0 also release) on target enter data."
    spec:
      50:
        citation: "OpenMP 5.0 §2.12.3, p.166"
        text: "A map-type must be specified in all map clauses and must be either to or alloc."
      52:
        citation: "OpenMP 5.2 §13.6, p.281"
        text: "All map clauses must be map-entering."
        also: ["OpenMP 5.2 §5.8.3, p.151"]
      60:
        citation: "OpenMP 6.0 §15.5, p.455"
        text: "All map clauses must be map-entering clauses."
        also: ["OpenMP 6.0 §7.9.1, p.274", "OpenMP 6.0 §7.9.1, p.275"]

  - id: targetexitdata-map-001
    check: static
    status: provisional
    predicate: exit_data_map_exiting
    example: "!$omp target exit data map(to: a)"
    notes: "Isolation: map(to: a) (5.2 also alloc; 6.0 also alloc) on target exit data."
    spec:
      50:
        citation: "OpenMP 5.0 §2.12.4, p.169"
        text: "A map-type must be specified in all map clauses and must be either from, release, or delete."
      52:
        citation: "OpenMP 5.2 §13.7, p.283"
        text: "All map clauses must be a map-exiting."
        also: ["OpenMP 5.2 §5.8.3, p.151"]
      60:
        citation: "OpenMP 6.0 §15.6, p.457"
        text: "All map clauses must be map-exiting clauses."
        also: ["OpenMP 6.0 §7.9.1, p.274", "OpenMP 6.0 §7.9.1, p.275"]

  - id: mapitem-map-001
    check: static
    status: provisional
    predicate: map_same_item_same_mapper
    example: "!$omp target map(mapper(m), to: a) map(from: a)"
    notes: "Isolation: the same item in two map clauses of one construct, one with mapper(m)."
    spec:
      52:
        citation: "OpenMP 5.2 §5.8.3, p.156"
        text: "If the same list item appears more than once in map clauses on the same construct, the map clauses must specify the same mapper modifier."
      60:
        citation: "OpenMP 6.0 §7.9.6, p.286"
        text: "If the same list item appears more than once in map clauses on the same construct, the map clauses must specify the same mapper modifier."

  - id: mapitem-map-002
    check: static
    status: provisional
    predicate: map_whole_and_part
    example: "!$omp target map(to: a) map(from: a(1:n))"
    notes: "Context requirement (5.2): the base variable needs a visible non-POINTER declaration in the source, with no USE statement between the directive and the declaration (or in the declaring unit) that may supply the name; for s%c, s must be declared type(t) with t defined in the source (resolved from the unit declaring s; nested components from the unit defining each type) and c non-POINTER. A POINTER, undeclared or possibly use-associated base (or type) never fires. Isolation: real, allocatable :: a(:) then map(to: a) map(from: a(1:n))."
    spec:
      50:
        citation: "OpenMP 5.0 §2.19.7.1, p.323"
        text: "List items of the map clauses on the same construct must not share original storage unless they are the same variable or array section."
      52:
        citation: "OpenMP 5.2 §5.8.3, p.156"
        text: "Two list items of the map clauses on the same construct must not share original storage unless they are the same list item or unless one is the containing structure of the other."

  - id: mapitem-map-003
    check: static
    status: provisional
    predicate: map_self_consistent
    example: "!$omp target map(self: a) map(to: a(1:n))"
    notes: "Isolation (6.0): map(self: a) plus map(to: a(1:n)) without self."
    spec:
      60:
        citation: "OpenMP 6.0 §7.9.6, p.287"
        text: "If a list item appears in a map clause with the self-modifier, any other list item in a map clause on the same construct that has the same base variable or base pointer must also be specified with the self-modifier."

  - id: target-dsa-001
    check: static
    status: provisional
    predicate: target_dsa_not_mapped
    example: "!$omp target map(to: a) firstprivate(a)"
    notes: "Isolation: firstprivate(a) on a bare target that also maps a."
    spec:
      50:
        citation: "OpenMP 5.0 §2.19.7.1, p.321"
        text: "A list item cannot appear in both a map clause and a data-sharing attribute clause on the same construct unless the construct is a combined construct."
      52:
        citation: "OpenMP 5.2 §13.8, p.286"
        text: "A list item in a data-sharing attribute clause that is specified on a target construct must not have the same base variable as a list item in a map clause on the construct."
      60:
        citation: "OpenMP 6.0 §15.8, p.463"
        text: "A list item in a data-sharing attribute clause that is specified on a target construct must not have the same base variable as a list item in a map clause on the construct."

  - id: defaultmap-map-001
    check: static
    status: provisional
    predicate: defaultmap_category_once
    example: "!$omp target defaultmap(tofrom: scalar) defaultmap(firstprivate: scalar)"
    notes: "Defaultmap may repeat on a construct (spec_overrides.yaml repeatable_clauses), so this rule checks parsed source; tests/engine/test_generators.py."
    spec:
      50:
        citation: "OpenMP 5.0 §2.12.5, p.174"
        text: "At most one defaultmap clause for each category can appear on the directive."
      52:
        citation: "OpenMP 5.2 §5.8.7, p.162"
        text: "A given variable-category may be specified in at most one defaultmap clause on a construct."
      60:
        citation: "OpenMP 6.0 §7.9.9, p.292"
        text: "A given variable-category may be specified in at most one defaultmap clause on a construct."

  - id: defaultmap-map-002
    check: static
    status: provisional
    predicate: defaultmap_all_alone
    example: "!$omp target defaultmap(tofrom: all) defaultmap(firstprivate: scalar)"
    notes: "Defaultmap may repeat on a construct (spec_overrides.yaml repeatable_clauses), so this rule checks parsed source; tests/engine/test_generators.py."
    spec:
      52:
        citation: "OpenMP 5.2 §5.8.7, p.162"
        text: "If a defaultmap clause specifies the all variable-category, no other defaultmap clause may appear on the construct."
      60:
        citation: "OpenMP 6.0 §7.9.9, p.292"
        text: "If a defaultmap clause specifies the all variable-category, no other defaultmap clause may appear on the construct."

  - id: usedevice-clause-001
    check: static
    status: provisional
    predicate: use_device_no_structure_element
    example: "!$omp target data map(to: s) use_device_addr(s%a)"
    notes: "Isolation (5.2): use_device_addr(s%a) on target data (a structure component, not mapped twice)."
    spec:
      52:
        citation: "OpenMP 5.2 §5.4.10, p.124"
        text: "Each list item must not be a structure element."
        also: ["OpenMP 5.2 §5.4.8, p.122"]

  - id: usedevice-clause-002
    check: static
    status: provisional
    predicate: use_device_addr_section_base
    example: "!$omp target data map(to: s) use_device_addr(s%a(1:n))"
    notes: "Isolation (6.0): use_device_addr(s%a(1:n)) on target data."
    spec:
      60:
        citation: "OpenMP 6.0 §7.5.10, p.239"
        text: "If a list item is an array section, the array base must be a base language identifier."

# --- clause arguments --------------------------------------------------------------------

  - id: dnm-clause-001
    check: static
    status: provisional
    predicate: dnm_names_constituent
    example: "!$omp target teams num_teams(parallel do: 4)   (6.0); !$omp target simd if(parallel: x)"
    notes: "Isolation: a directive-name modifier naming a directive that is not a constituent (5.2: if(parallel: x) on target simd; 6.0: num_teams(parallel do: 4) on target teams)."
    spec:
      52:
        citation: "OpenMP 5.2 §3.4, p.72"
        text: "The directive-name-modifier must specify the directive-name of the construct or of a constituent construct of the directive-specification on which the if clause appears."
      60:
        citation: "OpenMP 6.0 §5.4, p.174"
        text: "The directive-name-modifier must specify the directive name of either the directive on which the clause appears or a constituent directive of that directive."

  - id: if-clause-001
    check: static
    status: provisional
    predicate: if_once_per_constituent
    example: "!$omp target teams if(target: x) if(x)"
    notes: "Isolation: if(target: x) plus if(y) without modifier on target parallel."
    spec:
      50:
        citation: "OpenMP 5.0 §2.13.25, p.216"
        text: "If any if clause on the directive includes a directive-name-modifier then all if clauses on the directive must include a directive-name-modifier."
