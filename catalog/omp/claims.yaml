# Vendor claims for the first slice (OpenMP, free-form Fortran, target offload).
#
# Read by offload/engine/report.py (load_claims, compare_claims). Every entry is
# `status: provisional`: the mapping from a vendor's prose to catalog atoms is
# this project's reading and awaits the maintainer's review.
#
# Fields
#   source        short id of the document (see the sources list below)
#   url           where the claim is published (the citation)
#   toolchain     afar | cce19 (the compiler the claim is compared with)
#   atom / atoms  catalog atoms the claim covers (or `pattern`, an fnmatch glob)
#   claim         supported | unsupported | partial
#   form          optional: compile_error (an unsupported feature is a compile
#                 error, so anything but rejection contradicts it) or accepted
#                 (a partial feature is accepted, so rejection contradicts it)
#   general       true for a release-level statement ("full OpenMP 4.5"); it
#                 applies to an atom only when no specific claim for the same
#                 toolchain covers that atom
#   versions      optional: catalog versions (52, 60) the claim is compared at.
#                 Release-level 4.5/5.0 claims are compared with the 5.2
#                 programs only; 6.0 spellings are outside such claims.
#   quote         the vendor's words (verbatim, or "feature | status" for a
#                 status-table row)
#   language      language the vendor's statement is about
#   version_note  which compiler or release the document describes
#
# Sources
#   hpe-cce-intro-openmp      HPE intro_openmp(7). The quoted sentences are
#                             also in the man page shipped with CCE 19.0.0
#                             (/opt/cray/pe/cce/19.0.0/man/man7/intro_openmp.7,
#                             checked 2026-10-18); the web page describes the
#                             current release.
#   rocm-openmp-support       AMD "ROCm OpenMP support": "fully supports the
#                             OpenMP 4.5 standard and a subset of OpenMP 5.0,
#                             5.1, and 5.2 standards" (release-level, ROCm 7.x
#                             LLVM; no per-feature list).
#   rocm-clang-openmp-status  AMD-hosted Clang 20.0.0git OpenMPSupport table:
#                             C/C++ only, older than AFAR's 24.0.0git; a
#                             purported column for amdflang.
#   afar-flang-openmp-status  flang/docs/OpenMPSupport.md at the exact AFAR
#                             24.3.0 source commit of ROCm/llvm-project
#                             (copied to data/index/claims/amdflang_afar_openmp_status.csv).
#                             Status good -> supported, part / progress ->
#                             partial, none -> unsupported. Quotes use the CSV
#                             transcription's status codes; the rendered page
#                             words them differently (good is shown as done,
#                             none as unclaimed).
#   afar-flang-lowering-todo  flang/test/Lower/OpenMP/Todo tests at the same
#                             commit: the lowering stops with "not yet
#                             implemented" (the doc calls these authoritative).
#                             Listed in data/index/claims/amdflang_afar_lowering_todo_tests.txt.

