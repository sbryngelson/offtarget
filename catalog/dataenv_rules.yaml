    observable: "p points to a(0:n-1), mapped tofrom by target data; the region sets p[i] = 2*p[i] + 1: after the target data region the host sees 2*i + 1"
    template: c_pointer_rw
    spec:
      - {version: "OpenMP 5.0", section: "2.19.7", page: 315, lines: "1-2", quote: "A variable that is of type pointer is treated as if it is the base pointer of a zero-length array section that appeared as a list item in a map clause"}
      - {version: "OpenMP 5.0", section: "2.19.7.1", page: 317, lines: "30-31", quote: "The corresponding pointer variable is assigned an address such that the corresponding list item can be accessed through the pointer in a target region"}
      - {version: "OpenMP 5.2", section: "5.8.1", page: 148, lines: "30-31", quote: "is treated as if it is the base pointer of a zero-length array section that had appeared as a list item in a map clause"}
      - {version: "OpenMP 5.2", section: "5.8.3", page: 152, lines: "9-10", quote: "The corresponding pointer variable is assigned an address such that the corresponding list item can be accessed through the pointer in a target region"}
      - {version: "OpenMP 6.0", section: "7.9.3", page: 277, lines: "6-7", quote: "A variable that is of type pointer, but is neither a pointer to function nor (for C++) a pointer to a member function, is treated as if it is the array base of a zero-offset assumed-size array"}
      - {version: "OpenMP 6.0", section: "7.9.6", page: 284, lines: "10-11", quote: "pointer attachment is performed and the corresponding pointer becomes an attached pointer to the corresponding list item"}

