# Agent decisions of the confirmer's needs_human results for the
# fuzz campaign s1 (s1 at HSA_XNACK=1, s1x0 at HSA_XNACK=0), and the spot
# checks of a seeded 10% of each rule-decided verdict class
# (offload/engine/confirm/decisions.py; `tools/confirm.py decide`).
#
# decisions: `match` selects needs_human results (rule glob, toolchains,
# outcomes, regexes over the case's reason and the result's signature,
# or case ids); the first matching decision gives `verdict`; `basis` is
# the evidence read and the spec text. A decision never overrides a
# verdict the rules gave. `own_sample_class: true`: the case-level spot
# sample draws the decision's cells as a class of their own.
# findings: the campaign's new findings (data/findings/fuzz/), as the
# minimized.json rows of their run (the dashboard's findings table).
# spot_checks: one entry per signature group of the sampled cases
# (`group` = "<verdict>|<toolchain>|<outcome>|<rule>|<cause>"), with the
# number of sampled cases in it, agree true/false and the note; a
# disagreement names the rule fix it led to.
version: 1
decisions:
  - id: D1-strided-target-update
    match: {rule: "R12b-*", toolchains: [cce19, cce20, cce21],
            reason: "ftn-1747"}
    verdict: compiler_bug
    basis: >-
      CCE rejects target update to(x(1:n:2)) ("The stride specified for
      array ... in the MAP clause must not be greater than 1"); every
      diagnostic points at a target update statement (checked on all
      cases). Legal: "A stride expression may not be specified unless
      otherwise stated" (5.2 §3.2.5 p.66) and the data-motion clauses
      state it: "The list items may include array sections with stride
      expressions" (5.2 §5.9 p.165); added in 5.0 ("The target update
      construct (see Section 13.9) was modified to allow array sections
      that specify discontiguous storage", 5.2 §B.4 p.634); the map
      clause keeps its contiguity restriction (§5.8.3 p.156). CCE claims
      full OpenMP 5.0 (intro_openmp). The other families reject these
      programs at other statements (R12b); the same diagnostic is R11
      compiler_bug in the programs AFAR compiles with the strided update
      (AFAR itself reports "stride cannot be specified on an array
      section" in some programs, and gfortran 13 rejects it too: neither
      is a legality verdict). Probe data/evidence/dataenv_probe/strided_update.f90.
      AFAR's message is a non-fatal "error:"
      for strided sections of structure components (gs%k(1:n:2)): 289
      AFAR cells of s1/s1x0 carry it and none agrees (194 compile_reject
      for other causes, 68 run_error, 17 wrong_code, 10 ICE), and 22 of
      AFAR's 138 present-modifier aborts are among them (8 times the base
      rate); a likely AFAR defect, not reduced (fuzz/s1-6888-cce21.f90).
      It does not bear on these CCE cells.

  - id: D2-default-none-loop-variable
    match: {rule: "R12b-*", toolchains: [cce19, cce20, cce21],
            reason: 'ftn-1510 .*Variable "[IJ]" must'}
    verdict: compiler_bug
    basis: >-
      CCE's ftn-1510 names the iteration variable of the loop associated
      with the enclosing teams distribute default(none) construct (checked
      on all cases); it is predetermined private ("The loop iteration
      variable in any associated loop of a loop-associated construct is
      otherwise private", 5.2 §5.1.1 p.97), and default(none) concerns
      only variables without a predetermined attribute (5.2 §5.4.1 p.109).

  - id: D3-default-none-false-diagnostic
    match: {rule: "R12b-*", toolchains: [cce19, cce20, cce21],
            reason: 'ftn-1510 .*Variable "(?!I"|J"|LSIMD"|LPAR")\w+" must'}
    verdict: compiler_bug
    basis: >-
      CCE's ftn-1510 says DEFAULT(NONE) was specified for a statement of a
      procedure none of whose enclosing constructs has a default clause
      (checked on every case: the statement's enclosing directives up to
      its procedure; e.g. s1 seed 91 kp2, a target parallel / masked
      region with no default clause). default(none) restricts only the
      variables referenced in its own construct (5.2 §5.4.1 p.109): a
      false diagnostic.

  - id: D4-defaultmap-none-mapped-variable
    match: {rule: "R12b-*", toolchains: [cce19, cce20, cce21],
            reason: "ftn-1964"}
    verdict: compiler_bug
    basis: >-
      CCE's ftn-1964 ("must have its data mapping attribute explicitly
      declared because default map(none) was specified") names a variable
      that the target construct with defaultmap(none: aggregate) lists in
      a map clause, or a statement with no defaultmap(none) construct
      around it (checked on every case); 5.2 §5.8.7 p.162 requires only
      that such variables be listed in a data-environment attribute
      clause. The class of defaultmap-none-loop-variable.f90 (CCE 19
      reports b although b is in map(from: b)).

  - id: D5-firstprivate-split-to-the-worksharing-leaf
    match: {rule: "R12b-*", toolchains: [cce19, cce20, cce21],
            reason: 'ftn-1310 .*Object "[IJ]"'}
    verdict: compiler_bug
    basis: >-
      parallel do default(none) shared(...) firstprivate(i) nested in a
      teams distribute loop over i: firstprivate on the combined construct
      applies to the worksharing leaf and "the effect is as if the shared
      clause with the same list item is applied to the parallel construct"
      (5.2 §17.2 p.340), so i is shared in the parallel region and the
      worksharing-construct restriction on items private in the binding
      parallel region does not apply (5.2 §5.4.4); CCE's ftn-1310 ("It
      must have a shared scope in the enclosing region") is wrong.

