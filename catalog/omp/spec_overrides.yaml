    since: 60
    citation: "OpenMP 6.0 §9.9.1, p.346"
    status: provisional

  - directive: begin declare target
    spelling: begin declare target
    since: 60
    citation: "OpenMP 6.0 §9.9.2, p.349"
    status: provisional
    notes: "(C): 'The begin declare_target directive may alternatively be specified with begin declare target as the directive-name.'"
  - directive: end declare target
    spelling: end declare target
    since: 60
    citation: "OpenMP 6.0 §5.1, p.150"
    status: provisional
    notes: "(C): the paired end directive of begin declare target: 'If the directive-name of such a directive starts with begin, the end directive has the same directive name except begin is replaced with end.'"

directive_versions:
  - directive: begin declare target
    since: 51
    citation: "OpenMP 5.1 §2.14.7, p.211"
    status: provisional
    notes: "(the C 5.0 slice): the begin declare target directive first appears in 5.1 (#pragma omp begin declare target, 5.1 §2.14.7); 5.0's delimited form is declare target ... end declare target (5.0 §2.12.7, p.181), which the 5.0 C slice does not have as an atom of its own."
  - directive: workdistribute
    since: 60
    citation: "OpenMP 6.0 §13.5, p.412"
    status: provisional
    notes: "No workdistribute construct in the 5.2 text; the 6.0 features history lists it as added in 6.0."
  - directive: teams workdistribute
    since: 60
    citation: "OpenMP 6.0 §13.5, p.412"
    status: provisional
    notes: "Leaf workdistribute is new in 6.0."
  - directive: target teams workdistribute
    since: 60
    citation: "OpenMP 6.0 §13.5, p.412"
    status: provisional
    notes: "Leaf workdistribute is new in 6.0."
  - directive: target loop
    since: 60
    citation: "OpenMP 5.2 §17.3, p.342"
    also_cited: ["OpenMP 6.0 §19.1, p.526"]
    status: provisional
    notes: "5.2: if directive-name-A is target then directive-name-B may be simd, parallel, teams, a teams compound, or a parallel compound with a loop, for or do leaf; plain loop is not listed. 6.0 allows target (parallelism-generating) with loop (partitioned)."

clause_rules:
  - directive: begin declare target
    clause: to
    remove: true
    citation: "OpenMP 5.2 §7.8.2, p.207"
    also_cited: ["OpenMP 6.0 §9.9.2, p.349"]
    status: provisional
    notes: "(C): the begin declare target directive takes device_type and indirect only (5.2 §7.8.2, 6.0 §9.9.2); TableGen also lists to and link."
  - directive: begin declare target
    clause: link
    remove: true
    citation: "OpenMP 5.2 §7.8.2, p.207"
    also_cited: ["OpenMP 6.0 §9.9.2, p.349"]
    status: provisional
    notes: "(C): see the to entry."
  - directive: declare target
    clause: to
    until: 52
    citation: "OpenMP 6.0 §9.9.1, p.346"
    also_cited: ["OpenMP 6.0 §7.10.1, p.297"]
    status: provisional
    notes: "6.0 lists device_type, enter, indirect, link and local on declare_target, and puts to only on target_update; 5.2 §5.8.4 keeps to as a deprecated synonym of enter."
  - directive: target parallel do
    clause: allocator
    remove: true
    citation: "OpenMP 5.2 §6.4, p.175"
    also_cited: ["OpenMP 6.0 §8.4, p.310"]
    status: provisional
    notes: "The allocator clause appears only on the allocate directive in both versions; TableGen allows it on target parallel do."
  - directive: target parallel do
    clause: allocate
    add: true
    since: 50
    citation: "OpenMP 5.2 §6.6, p.178"
    also_cited: ["OpenMP 5.2 §17.2, p.341", "OpenMP 6.0 §8.6, p.312", "OpenMP 6.0 §19.2, p.530"]
    status: provisional
    notes: "The allocate clause section lists target, parallel and do; a clause on a combined construct must apply to at least one leaf construct (§17.2 / §19.2). TableGen gives allocate (from 5.0) to target parallel, parallel do and target, but not to target parallel do."
  - directive: target parallel do
    clause: thread_limit
    add: true
    once: true
    since: 51
    citation: "OpenMP 5.2 §13.3, p.277"
    also_cited: ["OpenMP 5.2 §17.2, p.340", "OpenMP 6.0 §15.3, p.452", "OpenMP 6.0 §19.2, p.530"]
    status: provisional
    notes: "thread_limit is a target clause, and §17.2 applies thread_limit on a combined construct to all leaves that permit it. TableGen gives it (from 5.1, once) to target and target parallel, but not to target parallel do."
  - directive: target parallel do simd
    clause: thread_limit
    add: true
    once: true
    since: 51
    citation: "OpenMP 5.2 §13.3, p.277"
    also_cited: ["OpenMP 5.2 §17.2, p.340", "OpenMP 6.0 §15.3, p.452", "OpenMP 6.0 §19.2, p.530"]
    status: provisional
    notes: "Same leaves as target parallel do plus simd, which adds no restriction; §17.2 applies thread_limit to all leaves that permit it. TableGen omits it here."
  - directive: target loop
    clause: default
    add: true
    once: true
    since: 60
    citation: "OpenMP 6.0 §7.5.1, p.223"
    also_cited: ["OpenMP 6.0 §19.2, p.528", "OpenMP 5.2 §17.2, p.340"]
    status: provisional
    notes: "The 6.0 default clause section lists target (5.2 does not, so since 60, as on the target leaf); §19.2 gives every clause the default all-constituents property unless otherwise specified, and 5.2 §17.2 names default among the clauses applied to all leaves that permit them. loop adds no restriction. TableGen omits default on target loop."
  - directive: target simd
    clause: default
    add: true
    once: true
    since: 60
    citation: "OpenMP 6.0 §7.5.1, p.223"
    also_cited: ["OpenMP 6.0 §19.2, p.528", "OpenMP 5.2 §17.2, p.340"]
    status: provisional
    notes: "As for target loop: the target leaf permits default from 6.0 and simd adds no restriction (the argument used for thread_limit on target parallel do simd). TableGen omits default on target simd."
  - directive: target teams distribute simd
    clause: default
    since: 1
    citation: "OpenMP 5.2 §5.4.1, p.109"
    also_cited: ["OpenMP 5.2 §17.2, p.340", "OpenMP 6.0 §7.5.1, p.223", "OpenMP 6.0 §19.2, p.528"]
    status: provisional
    notes: "The teams leaf permits default at every version (the 5.2 and 6.0 default clause sections both list teams) and §17.2 applies default to all leaves that permit it, so the compound permits it at 5.2 as its sibling target teams distribute already does in TableGen (min_ver 1 there, hence since 1 here). TableGen gives target teams distribute simd default only from 6.0."
  - directive: target parallel
    clause: in_reduction
    add: true
    since: 50
    citation: "OpenMP 5.2 §17.2, p.339"
    also_cited: ["OpenMP 5.2 §17.4, p.343", "OpenMP 5.2 §5.5.10, p.138", "OpenMP 6.0 §7.6.12, p.256", "OpenMP 6.0 §19.2, p.528"]
    status: provisional
    notes: "in_reduction is permitted only on the target leaf (5.2 §5.5.10 and 6.0 §7.6.12 list target, task and taskloop; 6.0 adds target_data); a clause permitted on a single leaf of a compound construct applies to that leaf (5.2 §17.2, 6.0 §19.2), and no exclusion is stated. TableGen gives it to target and target loop (from 5.0) only. Corpus: gcc gfortran.dg/gomp/clauses-1.f90 (no expected error) and aomp smoke-fails FNew-flang-270386. 5.2 §17.4 (p.343) excludes in_reduction only when directive-name-A is parallel, which is not the case here."
