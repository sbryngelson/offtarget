  # Review sweep (5.2 clause lists): every (slice directive, clause)
  # allowed at 5.2 was checked against the "Directives" list of the clause's
  # 5.2 section (6.0 likewise); a clause on a compound needs a leaf in that
  # list (5.2 §17.2 / 6.0 §19.2). Narrowing only.
  - directive: requires
    clause: self_maps
    since: 60
    citation: "OpenMP 6.0 §10.5.1.6, p.361"
    also_cited: ["OpenMP 5.2 §8.2, p.210"]
    status: provisional
    notes: "self_maps is a 6.0 requires clause; the 5.2 text has no self_maps (the 5.2 requires directive lists none). TableGen allows it from version 1."
  - directive: teams
    clause: if
    since: 60
    citation: "OpenMP 5.2 §3.4, p.72"
    also_cited: ["OpenMP 6.0 §5.5, p.179"]
    status: provisional
    notes: "The 5.2 if clause lists cancel, parallel, simd, target, target data, target enter data, target exit data, target update, task and taskloop, not teams; 6.0 adds teams. TableGen allows it from 5.2. Provisional also because 5.2 contradicts itself: 5.2 §10.2 (teams) says the number of teams created \"is determined by evaluating the if and num_teams clauses\"."
  - directive: teams distribute
    clause: if
    since: 60
    citation: "OpenMP 5.2 §3.4, p.72"
    also_cited: ["OpenMP 5.2 §17.2, p.339", "OpenMP 6.0 §5.5, p.179"]
    status: provisional
    notes: "Neither leaf (teams, distribute) takes if at 5.2; teams does at 6.0. TableGen allows it from version 1. Provisional also because 5.2 contradicts itself: 5.2 §10.2 (teams) says the number of teams created \"is determined by evaluating the if and num_teams clauses\"."
