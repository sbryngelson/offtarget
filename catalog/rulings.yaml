# The rulings registry. Every legality or spec-reading ruling of
# data/reports/rulings.md that a confirmer rule (catalog/confirm_rules.yaml)
# or the legality gate can use, as an entry the confirmer cites by id.
# Nothing here is new: `rulings_md` is text of rulings.md (whitespace
# normalized; tests/confirm/test_confirm.py checks it occurs there), and
# each spec citation's `quote` occurs in that version's spec text, starting
# on the cited printed page or on the page after it (an item cited where
# it starts). A reading with no entry is needs_human for the confirmer.
# Keys: id, kind (legality | spec_reading | implementation_defined |
# unspecified | no_fixed_value | oracle | mode | environment | process),
# task, rulings_md, citations [{version, section, page, quote}] (empty for
# a process or maintainer ruling, which has no spec text), applies (programs:
# fnmatch patterns of program ids; needs: program markers; reasons:
# regular expressions on a failure's reason; requires: requirement
# clauses in the program text), test (a test that exercises the entry).
version: 1
entries:
  - id: RUL-REQUIRES-IMPLDEF
    kind: implementation_defined
    task: 26
    rulings_md: "supporting a requirement is implementation defined, 5.2 §8.2 p.211"
    citations:
      - {version: "5.2", section: "8.2", page: 211,
         quote: "Whether an implementation supports the feature that a given requirement clause specifies is implementation defined."}
    applies: {requires: [unified_shared_memory, unified_address, self_maps]}
    # NVHPC refuses the requirement at
    # compile time unless built with -gpu=unified (separate and managed
    # memory): a conforming refusal of an implementation-defined feature
    decides: {verdict: requirement_refused, families: [nvhpc], modes: [copy, managed], reason: "-gpu=unified", outcome: frontend_rejection}
    test: tests/confirm/test_confirm.py::test_needs_unified_memory_in_copy_mode

  - id: RUL-NEEDS-ZERO-COPY
    kind: mode
    task: 26
    rulings_md: "A program that needs zero-copy memory (needs zero_copy: requires unified_shared_memory, self_maps, the self modifier) gets `needs_zero_copy`, not `x1_only`, and its differences are `needs_unified_memory`"
    citations:
      - {version: "5.2", section: "8.2", page: 211,
         quote: "Whether an implementation supports the feature that a given requirement clause specifies is implementation defined."}
      - {version: "6.0", section: "7.9.6", page: 285,
         quote: "If a map-entering clause specifies a self map for a list item then runtime error termination is performed if any of the following is true"}
    applies: {needs: [zero_copy]}
    test: tests/confirm/test_confirm.py::test_needs_unified_memory_in_copy_mode

