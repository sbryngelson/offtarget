# One case per finding file checked for the vendor packets.
# Keys: id (the report or variant stem), vendor (amd | hpe | nvidia, or a
# list), finding (path under findings), affected (toolchains that show
# the defect), modes (AMD HSA_XNACK values where it shows; NVHPC 0 separate,
# 2 managed), arch (gfx942 = MI300A Tuolumne, gfx90a = MI250X Tioga,
# sm_80 = A100 wingtip), flags ({all|afar|cce|nvhpc|<toolchain>: extra
# compile flags}), opt (default -O2), symptom and expect (build.py patterns),
# edits (applied to the trimmed finding text), control ({edits} | {file} |
# {text}, with what: the one change), control_<key> (a key for the control
# only), compile_s / run_s (limits).

# --- top-level findings -------------------------------------------------------
