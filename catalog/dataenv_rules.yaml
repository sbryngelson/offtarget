# --- OpenMP: declare target, residency and reference counts --------------------------------------------

  - id: omp-declare-target-scalar-tofrom
    model: omp
    versions: ["5.0", "5.2", "6.0"]
    languages: [f90, c]
    subject: "a declare target (enter/to) variable referenced in a target construct is treated as map(tofrom); its list item is never removed (infinite reference count), so the region reads and writes the device copy"
    construct: target
    variable_kind: scalar
    attribute: [declare_target, module]
    clauses_present: []
    memory_mode: any
    expected: {dsa: n/a, map_type: tofrom, copy_back: "no", source: declare_target, residency: {copy: declare_target, unified: declare_target}}
    observable: "g = 101, target update to(g); the region copies g to rd and sets g = 2*g + 1; target update from(g): rd = 101, g = 203"
    template: declare_target_roundtrip
    spec:
