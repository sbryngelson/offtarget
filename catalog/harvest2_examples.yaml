# The OpenMP Examples (github.com/OpenMP/Examples, corpus/omp_examples)
# whose tags say `@@operation: run` and `@@expect: success` and that use a
# device construct or device routine (tools/campaigns/harvest2.py examples). Each entry
# gives the expected result the example itself documents:
#   checks: CHECK lines from the example's documented output (an //OUTPUT:,
#           "prints", "Outputs:" or trailing comment), or its own PASSED
#           lines; only lines printed on the host (a device print is
#           allowed but its output is not checked)
#   oracle: exit_status when the example checks itself (a nonzero exit,
#           ERROR STOP or STOP n on a wrong result) and prints nothing to
#           compare
#   modes:  copy or unified when the documented result holds in one only
#   skip:   why the example is not converted
# The examples' license: catalog note in offload/engine/harvest2/examples.py
# (BSD-style, OpenMP ARB, redistribution with the notice).
examples:
  data_environment/sources/groupprivate.1.f90:
    checks: ["CHECK: PASSED"]
