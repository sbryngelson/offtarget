# Confirmed catalog bugs without a finding (offload/engine/confirm/backlog.py,
# `tools/confirm.py backlog --write` -> data/reports/unlinked-bugs.md). `groups`: every group the
# backlog still has, with its cell count and why it has no finding (the test fails on a new or
# resized group); `closed`: how the backlog was closed.
version: 1
history: 'A review of the catalog on 2026-10-23 found 1,016 catalog cells with a bug verdict and no finding, draft or related
  link (974 with neither a duplicate nor a related link). After the findings index gained its data-derived gfx90a
  scope (134 cells became instances), 840 cells in 50 signature groups remained. Each group''s representative
  case went through `tools/confirm.py batch --draft` (offline, stored evidence; results/confirm/drafts/); every
  draft kept the verdict compiler_bug with the catalog program itself as the reproducer (catalog programs are one-feature
  programs of 30-60 lines; no minimization step was needed to keep the verdict). Four groups were explained by an
  existing finding whose README text names the programs, and were linked by a `programs` pattern; 33 groups (37
  signature groups: the four AFAR linear ICE groups share one stack, checked by compiling them, and the two AFAR
  workdistribute groups another) were promoted to data/findings/catalog/ (`tools/confirm.py promote`, then the index
  entry widened to the group''s compilers and programs). The C nohost groups left the backlog because the maintainer
  withdrew the gfortran/gcc witnesses (R12a cannot fire). What remains is listed below with the reason it has no
  finding.'
