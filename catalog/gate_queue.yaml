- id: capacity-large-args
  verdict: unspecified
  title: 'CCE runtime capacity: ''CRAY_ACC_ERROR - Large args not supported'''
  legality: 'The program is conforming but exceeds a capacity of the implementation (a kernel with hundreds
    of mapped arrays, reduction or shared scalars). Neither OpenMP nor OpenACC sets a limit, and the base
    language leaves capacity to the processor (Fortran 2008, ISO/IEC 1539-1:2010 §1.1: the standard does
    not specify ''the size or complexity of a program and its data that will exceed the capacity of any
    particular computing system or the capability of a particular processor''; quoted from the standard,
    which results/spec_cache does not hold). The stress campaign already counts these as break points
    (data/reports/fuzz-stress.md, Capacity).'
  determinism: 'At low load (6 concurrent runs per node) every run exits 1 with the message (six runs
    per cell in the gate''s paths a and b), though not uniformly fast (59: 19.6 s and 62.4 s, 67: 42.8
    s and 16.1 s, against about 3 s). That the gate''s timeouts in b and c came from its 24 concurrent
    reruns per node is an inference: these rows were not rerun at that load.'
  action: 'The row stops counting as a compiler failure (a capacity break point). No generator change:
    the stress axes exist to find break points and the stress report keeps them in its break-point table.'
  counts_as: none
- id: capacity-microtask-args
  verdict: unspecified
  title: 'AFAR runtime capacity: ''Too many arguments in kmp_invoke_microtask, aborting execution'''
  legality: 'Conforming C (64 to 1,024 reduction scalars on target teams distribute parallel for; 5.2
    §17.2 p.340), beyond the device runtime''s limit on the outlined function''s arguments, which it reports;
    capacity is the processor''s (C18, ISO/IEC 9899:2018 §1 para. 2: the standard does not specify ''the
    size or complexity of a program and its data that will exceed the capacity of any specific data-processing
    system''; not in results/spec_cache).'
  determinism: 'Every run fails with the message; after it the kernel traps, and the process then usually
    hangs to the limit instead of ending: in one build directory each, 63: 5 of 6 runs hang, 66: 5 of
    6, 64: 2 of 6, 65: 2 of 6 (the rest abort); the gate''s reruns: 63 4 of 4 hang. The break point (C
    int64 sum reductions on target teams distribute parallel for, data/evidence/gate_probe/reduce/red_c_N.c, every
    size from 8 to 64, two runs each): 62 scalars work, from 63 on the kernel traps and the process aborts
    (in the reduced program the message is not printed and nothing hangs within 30 s; the stress kernel
    prints it and mostly hangs).'
  action: 'The row stops counting as a compiler failure (a capacity break point, now in data/reports/fuzz-stress.md''s
    capacity table with its break point). A quality-of-implementation candidate (lower tier) is recorded:
    the runtime prints ''aborting execution'' and then hangs instead of ending the process (rates above).'
  counts_as: none
