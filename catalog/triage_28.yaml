    # sample
    own_sample_class: true
    match: {rule: "R12b-*", toolchains: [cce20, cce20_g90],
            reason: 'ftn-1725 .*"INDIRECT, LINK, TO or DEVICE_TYPE" was expected but found "E"'}
    verdict: compiler_bug
    basis: >-
      CCE 20 rejects `!$omp declare target enter(...)` (ftn-1725 "INDIRECT,
      LINK, TO or DEVICE_TYPE was expected but found E"); every diagnostic
      points at the enter keyword of a declare target directive (checked
      on all 2,597 s1 cells, 2,062 programs: line and column against the
      regenerated bundle file). The enter clause is the 5.2 spelling of
      to on declare target ("The clause-name to may be used as a synonym
      for the clause-name enter", 5.2 §5.8.4 p.158; "The enter clause was
      added as a synonym for the to clause on the declare target
      directive", Appendix B.2 p.627), and
      CCE 20.0.0's release notes claim "[5.2] ... misc. new syntax allowed
      by specification (e.g. `declare target`, ...)", whose only new 5.2
      declare target syntax is enter (catalog/omp/claims.yaml). Claimed and rejected: compiler_bug (R11 decides it where another
      family compiles the program; here the other families reject the
      program at other statements, so the rules stop at R12b, as for D1).
      CCE 19 has no such claim (R11c unsupported); CCE 21 accepts enter.

