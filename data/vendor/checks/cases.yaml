- id: cce-acc-routine-bind-module-ice
  vendor: hpe
  finding: cce-acc-routine-bind-module-ice.f90
  affected: [cce19, cce20, cce21]
  modes: [1, 0]
  arch: [gfx942, gfx90a]
  symptom: "compile:host associated to itself"
  expect: "outre:3\\D+5\\D+7\\D+9\\D+11\\D+13\\D+15\\D+17"
  control:
    what: "the two functions as external procedures instead of module procedures"
    text: |
      integer function dev_val(x)
        !$acc routine seq
        integer, intent(in) :: x
        dev_val = 2*x + 1
      end function dev_val
      integer function host_val(x)
        !$acc routine seq bind(dev_val)
        integer, intent(in) :: x
        host_val = -x
      end function host_val

      program t
        implicit none
        interface
          integer function host_val(x)
            !$acc routine seq bind(dev_val)
            integer, intent(in) :: x
          end function host_val
        end interface
        integer :: b(8), i
        !$acc parallel loop copyout(b)
        do i = 1, 8
          b(i) = host_val(i)
        end do
        print *, b
      end program t

