# Build offtarget and publish it to PyPI by Trusted Publishing (OIDC, no stored token) (docs/tooling/publishing.md).
# Every action is pinned to a commit.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/): a pending publisher for project
# "offtarget", this repository's GitHub account and name, workflow "release.yml", environment "pypi".
# The same on https://test.pypi.org with environment "testpypi" for the dry run.
#
# Publish to PyPI:     push a tag vX.Y.Z (git tag v0.1.0 && git push origin v0.1.0).
# Dry run to TestPyPI: Actions -> release -> Run workflow -> target testpypi.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # hatch-vcs reads the version from the tag
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build the sdist, and the wheel from the sdist
        run: |
          python3 -m pip install build==1.6.1 twine==7.0.0
          python3 -m build
          python3 -m twine check --strict dist/*
      - name: Install the wheel and check its version against the tag
        run: |
          python3 -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          got=$(cd /tmp && /tmp/v/bin/offload --version)
          echo "$got"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            test "$got" = "offload ${GITHUB_REF_NAME#v}"
          fi
          (cd /tmp && /tmp/v/bin/offload can-use clause.map.present > /dev/null)
      - name: Keep the distributions for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
