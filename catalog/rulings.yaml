  - id: RUL-METAMORPHIC-OTHER-FAMILY
    kind: process
    task: 28
    rulings_md: "A compiler family is no metamorphic witness against the expected value in a case of its own (spot-check fix): a compiler that fails deterministically prints the same wrong value on the spec-equivalent rewrites too, so its stable runs made every such wrong answer \"disputed\" or \"conflict\" (needs_human R22) however many other sources agreed; now only other families' rewrites count as the metamorphic source (as a family is never independent evidence)"
    citations: []
    applies: {}
    test: tests/confirm/test_confirm.py::test_the_case_family_is_no_metamorphic_witness_against_itself

  - id: RUL-METAMORPHIC-DISPUTE
    kind: process
    task: 28
    rulings_md: "R22b: a run-time failure whose expected value the metamorphic runs dispute (another family's runs of the original and its spec-equivalent rewrites give one value, the program's model another) is needs_human by its own rule with both values in the reason"
    citations: []
    applies: {}
    test: tests/confirm/test_confirm.py::test_metamorphic_dispute_is_named

  - id: RUL-FUZZ-G1-ILLEGAL
    kind: legality
    task: 28
    rulings_md: "Generator defect G1 (fuzz-3; found by CCE 19/20/21's ftn-1510 on 11 s1 programs and b5 seed 193): default(none) on a combined construct must also list the variable of an if(<leaf>:) clause whose leaf is nested inside the default's leaf (if(simd: lsimd) on parallel do simd, if(parallel: lpar) on teams distribute parallel do): the clause is applied to its leaf (5.2 §17.2 p.340), so the expression is evaluated inside the region where default(none) applies, and \"each variable that is referenced in the construct and does not have a predetermined data-sharing attribute must have its data-sharing attribute explicitly determined\" (5.2 §5.4.1 p.109)"
    citations:
      - {version: "5.2", section: "5.4.1", page: 109,
         quote: "each variable that is referenced in the construct and does not have a predetermined data-sharing attribute must have its data-sharing attribute explicitly determined"}
    applies: {}
    test: tests/confirm/test_confirm_legality.py::test_fuzz_program_with_a_known_generator_defect_is_illegal

