  # --- OpenMP 5.0: clauses the 5.0 text does not allow ---------------
  - directive: distribute
    clause: order
    since: 51
    citation: "OpenMP 5.0 §2.9.4.1, p.121"
    also_cited: ["OpenMP 5.1 §2.11.6.1, p.143"]
    status: provisional
    notes: "The 5.0 distribute clause list (private, firstprivate, lastprivate, collapse, dist_schedule, allocate) has no order clause; 5.1 adds order([order-modifier:]concurrent). On distribute no other leaf takes order (teams does not), so order is 5.1+ here. TableGen allows it from 5.0."
