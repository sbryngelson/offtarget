  # loop bind(thread) in a parallel region in a target region: the program
  # was nonconforming (a counter updated by every iteration of a loop whose
  # iterations may run concurrently) and is fixed; the fixed program still
  # fails: AFAR flang and CCE ftn share the iterations among the team.
  # : the finding is AFAR's
  # (bind(thread)); CCE fails these programs by the sequential-loop defect of
  # cce19-target-parallel-guarded-loop.f90 (also_findings: that finding's
  # toolchains are withdrawn too; without it the failing CCE runs dispute
  # the derived value, R14)
  - {version: 50, program: omp50-clause-bind-thread, disposition: compiler_wrong,
     also: program_fixed, cite: "5.0 §2.9.5 pp.129-130", finding: data/findings/fortran-loop-bind-thread-in-parallel.f90,
     also_findings: [data/findings/cce19-target-parallel-guarded-loop.f90],
     withdraw: [afar, cce19, cce20, cce21],
     needs_human: "R22 (RUL-DERIVED-NEEDS-EXECUTION), by design: the expected value check=pass is derived (derivation + model) with no executed witness: every compiler that ran this Fortran program is withdrawn (AFAR by the finding, CCE by the guarded-loop finding), the sequential elision gives no value, and OpenMP 5.0 has no C port (its 5.2 and 6.0 twins are compiler_bug because their C ports print check=pass on the device); the cells stay needs_human until a 5.0 witness exists",
     note: "program fixed first: each iteration records itself in hit(i, thread + 1) instead of mine = mine + 1 (a data race, 5.2 §11.7 p.257: the iterations may execute concurrently)"}
  - {version: 52, program: omp52-clause-bind-thread, disposition: compiler_wrong,
     also: program_fixed, cite: "5.2 §11.7 p.257, §11.7.1 p.258", finding: data/findings/fortran-loop-bind-thread-in-parallel.f90,
     also_findings: [data/findings/cce19-target-parallel-guarded-loop.f90],
     withdraw: [afar, cce19, cce20, cce21],
     note: "program fixed first: each iteration records itself in hit(i, thread + 1) instead of mine = mine + 1 (a data race: the iterations may execute concurrently)"}
  - {version: 60, program: omp60-clause-bind-thread, disposition: compiler_wrong,
     also: program_fixed, cite: "6.0 §13.8 p.423, §13.8.1 p.424", finding: data/findings/fortran-loop-bind-thread-in-parallel.f90,
     also_findings: [data/findings/cce19-target-parallel-guarded-loop.f90],
     withdraw: [afar, cce19, cce20, cce21],
     note: "program fixed first: each iteration records itself in hit(i, thread + 1) instead of mine = mine + 1 (a data race: the iterations may execute concurrently)"}
