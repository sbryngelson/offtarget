# Where the OpenMP spec overrides the TableGen skeleton (skeleton.yaml).
#
# This is the one place for such overrides, in both directions. Every entry
# cites the spec text that contradicts TableGen and is `status: provisional`
# until the project owner reviews it. Read by offload/engine/catalog.py
# (load_grammar), which the parser and slice_atoms use.
#
# directive_spellings: spellings the spec allows beyond the TableGen version
#   range, valid from `since` on.
# clause_rules: a skeleton clause rule for one directive that the spec
#   removes (`remove: true`), re-ranges (`since`/`until` each replace the
#   skeleton's bound, inclusive, so the range may narrow or widen; a bound
#   left out keeps the skeleton's), or adds (`add: true`, with `once`,
#   `since`, `until`) where the skeleton lacks a clause the spec allows. A
#   removed clause raises clause_not_allowed; a clause outside its range
#   raises version. `also_cited` lists further citations. The loader rejects
#   entries that name an unknown directive or clause, and a re-range that
#   leaves the skeleton's bounds unchanged.
# directive_versions: the version that introduced a directive, where
#   TableGen gives every spelling min version 0. Before `since` every
#   spelling raises version. Method (sweep of the slice): a directive
#   exists at 5.2 when each leaf construct has a construct section in the 5.2
#   text (offload.engine.spec_text) and a compound name follows the 5.2 naming
#   rules (§17.3); same at 6.0 with §19.1. The loader rejects unknown
#   directives, duplicate entries and entries that change nothing.

# skeleton_directives: directives TableGen lacks: `clauses_of` a
#   directive whose clause rules it shares, its `association` and
#   `spellings`. directive_languages: the languages of a
#   directive where TableGen's are wrong ([] for both). repeatable_clauses
#: clauses TableGen marks once that the spec lets repeat,
#   restricted instead by a rule of rules.yaml.

skeleton_directives:
  begin metadirective:
    clauses_of: metadirective
    association: Block
    spellings:
      - {text: begin metadirective, min_ver: 50, max_ver: null}
    citation: "OpenMP 5.2 §7.4.4, p.192"
    also_cited: ["OpenMP 5.0 §2.3.4, p.56", "OpenMP 6.0 §9.4.4, p.327"]
    status: provisional
    notes: "A delimited metadirective in C/C++ and Fortran; its paired end directive is end metadirective. TableGen has no record."

directive_languages:
  declare variant:
    languages: []
    citation: "OpenMP 5.2 §7.5.4, p.197"
    also_cited: ["OpenMP 5.0 §2.3.5, p.58"]
    status: provisional
    notes: "The Fortran form is !$omp declare variant([base-proc-name:]variant-proc-name) clause (5.0 §2.3.5 l.17); TableGen lists C only."

repeatable_clauses:
  defaultmap:
    citation: "OpenMP 5.2 §5.8.7, p.162"
    also_cited: ["OpenMP 5.0 §2.12.5, p.174", "OpenMP 6.0 §7.9.9, p.292"]
    status: provisional
    notes: "Once per variable category, not once per construct: rules.yaml defaultmap-map-001 and -002 check it."

