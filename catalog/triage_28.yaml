              "fuzz:s1:3036:cce21:gfx942:unified",
              "fuzz:s1:227:cce20:gfx942:unified",
              "fuzz:s1:227:cce21:gfx942:unified",
              "fuzz:s1:227:cce20:gfx942:copy",
              "fuzz:s1:227:cce21:gfx942:copy"]}
    verdict: compiler_bug
    basis: >-
      Wrong answer on CCE of a program with target simd
      lastprivate(conditional: x) and x in no map clause: the known finding
      fuzz/b2-209-cce19.f90 (CCE loses the implicit map(tofrom) of a
      conditional lastprivate item on a combined target construct, 5.2
      §17.2 p.340; the probes data/evidence/dataenv_probe/lpcond_simd_*.f90 show lp
      unchanged on CCE 19/20/21 at gfx942 and gfx90a, and correct with an
      explicit map or without the modifier). Most of these programs were
      called noncompliant by the host check only because CCE's host
      fallback loses the value too and AFAR does not implement the
      modifier. Per-case check (fix;
      data/evidence/dataenv_probe/d7_check.py, results/t28_probe/d7_check.jsonl): each
      of the 11 programs, rewritten with an explicit map(tofrom: x) on its
      target simd lastprivate(conditional: x) directive (what 5.2 §17.2
      p.340 makes implicit), prints the model's value on the case's
      toolchain and memory mode, while the original prints the stored
      wrong value: 11 of 11 confirmed.

