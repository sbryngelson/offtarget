      - {version: "OpenMP 5.2", section: "5.8.1", page: 149, lines: "6-7", quote: "If a scalar variable has the TARGET, ALLOCATABLE or POINTER attribute then it is treated as if it had appeared in a map clause with a map-type of tofrom"}
      - {version: "OpenMP 6.0", section: "7.9.3", page: 277, lines: "17-18", quote: "If a scalar variable has the TARGET, ALLOCATABLE or POINTER attribute then it is treated as if it had appeared in a map clause with a map-type of tofrom"}

  - id: omp-target-scalar-pointer
    model: omp
    versions: ["5.0", "5.2", "6.0"]
    languages: [f90]
    subject: "an associated Fortran scalar pointer referenced in a target construct is mapped tofrom, with its target"
    construct: target
    variable_kind: scalar
    attribute: [pointer]
    clauses_present: []
    memory_mode: any
    expected: {dsa: n/a, map_type: tofrom, copy_back: "yes", source: implicit}
    observable: "p => t, t = 101; the region copies p to rd and sets p = 2*p + 1: rd = 101 and t = 203 on the host"
    template: scalar_rw
    spec:
      - {version: "OpenMP 5.0", section: "2.19.7", page: 315, lines: "7-8", quote: "If a scalar variable has the TARGET, ALLOCATABLE or POINTER attribute then it is treated as if it has appeared in a map clause with a map-type of tofrom"}
      - {version: "OpenMP 5.0", section: "2.19.7.1", page: 317, lines: "22-24", quote: "If a list item in a map clause is an associated pointer and the pointer is not the base pointer of another list item in a map clause on the same construct, then it is treated as if its pointer target is implicitly mapped in the same clause"}
      - {version: "OpenMP 5.2", section: "5.8.1", page: 149, lines: "6-7", quote: "If a scalar variable has the TARGET, ALLOCATABLE or POINTER attribute then it is treated as if it had appeared in a map clause with a map-type of tofrom"}
      - {version: "OpenMP 5.2", section: "5.8.3", page: 152, lines: "1-3", quote: "If a list item in a map clause is an associated pointer and the pointer is not the base pointer of another list item in a map clause on the same construct, then it is treated as if its pointer target is implicitly mapped in the same clause"}
      - {version: "OpenMP 6.0", section: "7.9.3", page: 277, lines: "17-18", quote: "If a scalar variable has the TARGET, ALLOCATABLE or POINTER attribute then it is treated as if it had appeared in a map clause with a map-type of tofrom"}

