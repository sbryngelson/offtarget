# The data-environment rule table. The spec's data-sharing, mapping and residency rules for
# OpenMP 5.0, 5.2 and 6.0 and OpenACC 3.4, one row per rule. Read by offload.engine.dataenv_rules (schema,
# vocabularies, citation check) for the program generator (offload.engine.dataenv_gen).
#
# Row fields (offload/engine/dataenv_rules.py docstring):
#   id, model (omp|acc), versions, languages (f90, c: the languages the generator writes the rule in)
#   spec       citations, one or more per version: {version, section, page, lines, quote}; page is the
#              PRINTED page read from the page footer (the text above a footer is on that footer's page),
#              lines are the margin numbers (OpenMP: per page; OpenACC: through the document); every quote
#              is checked against results/spec_cache/ (tools/dataenv/dataenv.py cite; tests/dataenv/test_dataenv.py)
#   subject    what the rule decides
#   construct, variable_kind, attribute, clauses_present, memory_mode: the axes (dataenv_rules.AXES)
#   expected   dsa, map_type, copy_back, source (40d's Binding vocabulary); residency when the memory
#              mode changes it. copy_back: whether the region's write reaches the original list item when
#              the construct ends. For OpenACC, source declare_target is a visible declare directive and
#              map_type present an item present by a visible data clause; n/a: the rule decides no such
#              attribute
#   observable how a program shows the expected result on the host
#   template   the generator template (offload.engine.dataenv_gen.TEMPLATES)
#
# memory_mode: any = the expected value holds whether or not an original and its corresponding item share
# storage (both modes). It says nothing about detection: where a rule copies an array back, shared storage
# shows the region's writes on the host with or without a copy-back, so a unified-memory pass is no evidence
# of the copy-back (the oracle audit's map(to:) mutants survive there). copy =
# the expected value holds only where they do not share storage (discrete device memory: HSA_XNACK=0, NVHPC
# -gpu=mem:separate); unified = it needs shared storage (HSA_XNACK=1, NVHPC managed memory).
# OpenMP 5.2 §5.8.3 p.153 l.26-28 and 6.0 §7.9.6 p.284 l.13-15: the original and corresponding list items
# "may share storage"; OpenACC 3.4 §2.7 p.48 l.1654-1660: an implementation "may avoid the memory
# allocation and data movement and simply share the data in local memory".
#
# Expected values come from the rule text; nothing here names a compiler or a measured result.

rules:

# --- OpenMP: implicit data-sharing and mapping in a target construct ---------------------------------

  - id: omp-target-scalar-firstprivate
    model: omp
    versions: ["5.0", "5.2", "6.0"]
    languages: [f90, c]
    subject: "a scalar without the TARGET, ALLOCATABLE or POINTER attribute, referenced in a target construct with no clause for it, is not mapped: it is firstprivate"
    construct: target
    variable_kind: scalar
    attribute: [none]
    clauses_present: []
    memory_mode: any
    expected: {dsa: firstprivate, map_type: none, copy_back: "no", source: implicit}
    observable: "v = 101 on the host; the region copies v to rd (map from) and sets v = 2*v + 1: rd = 101, and v stays 101 on the host (the write is to the private copy)"
    template: scalar_rw
    spec:
      - {version: "OpenMP 5.0", section: "2.19.1.1", page: 272, lines: "25-26", quote: "In a target construct, variables that are not mapped after applying data-mapping attribute rules"}
      - {version: "OpenMP 5.0", section: "2.19.7", page: 315, lines: "9", quote: "If none of the above rules applies then a scalar variable is not mapped"}
      - {version: "OpenMP 5.2", section: "5.1.1", page: 99, lines: "19-20", quote: "In a target construct, variables that are not mapped after applying data-mapping attribute rules"}
      - {version: "OpenMP 5.2", section: "5.8.1", page: 149, lines: "8-9", quote: "If the above rules do not apply then a scalar variable is not mapped but instead has an implicit data-sharing attribute of firstprivate"}
      - {version: "OpenMP 6.0", section: "7.1.1", page: 213, lines: "22-23", quote: "In a target construct, variables that are not mapped after applying data-mapping attribute rules"}
      - {version: "OpenMP 6.0", section: "7.9.3", page: 277, lines: "22-23", quote: "If the above rules do not apply then a scalar variable is not mapped but instead has an implicitly determined data-sharing attribute of firstprivate"}

  - id: omp-target-array-tofrom
    model: omp
    versions: ["5.0", "5.2", "6.0"]
    languages: [f90, c]
    subject: "an array referenced in a target construct with no clause for it is mapped tofrom"
    construct: target
    variable_kind: array
    attribute: [none]
    clauses_present: []
    memory_mode: any
    expected: {dsa: n/a, map_type: tofrom, copy_back: "yes", source: implicit}
    observable: "a(i) = i on the host; the region sets a(i) = 2*a(i) + 1: the host sees 2*i + 1"
    template: array_rw
    spec:
      - {version: "OpenMP 5.0", section: "2.19.7", page: 315, lines: "5-6", quote: "If a variable is not a scalar then it is treated as if it had appeared in a map clause with a map-type of tofrom"}
      - {version: "OpenMP 5.2", section: "5.8.1", page: 149, lines: "4-5", quote: "If a variable is not a scalar then it is treated as if it had appeared in a map clause with a map-type of tofrom"}
      - {version: "OpenMP 6.0", section: "7.9.3", page: 277, lines: "15-16", quote: "If a variable is not a scalar variable then it is treated as if it had appeared in a map clause with a map-type of tofrom"}

