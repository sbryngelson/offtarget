# Every candidate restriction sentence of the slice's sections, classified by hand.
# Sentences: offload.engine.coverage.extract (the scope and the keyword scan); test:
# tests/engine/test_generators.py; rendered into data/reports/rules-coverage.md by tools/derive/rules_coverage.py.
# class: static (a rule), covered (a batch 1 rule or the grammar), deferred
# (static-checkable, not encoded: why), runtime, out_of_slice, informative.
# c: for a C/C++ sentence, its class for the C slice (the Fortran
# class stays out_of_slice), with rule / why / note as above (note "C++
# only" for sentences about C++ features).
sentences:
- version: '5.2'
  section: '3.1'
  page: 54
  language: both
  scope: slice
  origin: Restrictions
  text: Orphaned separating directives are prohibited. That is, the separating directives
    must appear within the structured block associated with the same construct with
    which it is associated and must not be encountered elsewhere in the region of
    that associated construct.
  class: static
  rule: scan-placement-002
- version: '5.2'
  section: '3.1'
  page: 54
  language: both
  scope: slice
  origin: Restrictions
  text: A stand-alone directive may be placed only at a point where a base language
    executable statement is allowed.
  class: deferred
  why: needs executable- versus specification-part positions of statements (e.g.
    after a logical IF); not recorded
- version: '5.2'
  section: '3.1'
  page: 54
  language: Fortran
  scope: slice
  origin: Restrictions
  text: OpenMP directives, except simd and declarative directives, may not appear
    in pure procedures.
  class: deferred
  why: PURE procedures are not recorded; no slice program uses one
- version: '5.2'
  section: '3.1'
  page: 54
  language: Fortran
  scope: slice
  origin: Restrictions
  text: OpenMP directives may not appear in the WHERE, FORALL or DO CONCURRENT constructs.
  class: deferred
  why: WHERE and FORALL constructs are not tracked; no slice program puts a directive
    in a DO CONCURRENT body
