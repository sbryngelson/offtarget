# Programs from training material, example collections and
# applications made self-checking by recorded edits (offload/engine/harvest2/hand.py;
# tools/campaigns/harvest2.py hand). `repos`: each source's clone (root: git/<owner>__<name>
# under HARVEST2_SRC, or corpus/apps/<name>), its license, and the files looked at
# and not converted (`skipped`, with the reason). `programs`: one entry per
# program: the file, its edits (each an exact replacement and why), and `why`,
# the expected result and where it comes from (the program's own reference
# computation or the source's documented values; never a compiler's output).
# `modes: [unified]` for a program that requires unified shared memory (its own
# requires directive, or one added because it dereferences host memory in a
# target region without a map).
# `programs` lists the dev programs only: the holdout's
# recipes are not committed; its labels are sealed in data/bench/harvest2-holdout.
_edits:
  stdlib: &stdlib
    old: "#include <stdio.h>\n"
    new: "#include <stdio.h>\n#include <stdlib.h>\n"
    why: "#include <stdlib.h> added (malloc and exit are used; an implicit declaration is not C99)"
  usm_c: &usm_c
    old: "#include <stdio.h>\n"
    new: "#include <stdio.h>\n#pragma omp requires unified_shared_memory\n"
    why: "requires unified_shared_memory added (the example dereferences host memory in target regions without a map; written for the MI300A APU)"
  stdlib_usm_c: &stdlib_usm_c
    old: "#include <stdio.h>\n"
    new: "#include <stdio.h>\n#include <stdlib.h>\n#pragma omp requires unified_shared_memory\n"
    why: "#include <stdlib.h> and requires unified_shared_memory added (malloc/exit used; host memory dereferenced in target regions without a map; written for the MI300A APU)"
  n_small: &n_small
    old: "int N=1000000;"
    new: "int N=100000;"
    why: "N from 1000000 to 100000 (two float stack arrays of N would take 8 MB of stack)"
  saxpy_y1d_check: &saxpy_y1d_check
    old: "   printf(\"y[N-1] %lf\\n\",y[N-1]);\n"
    new: "   printf(\"y[N-1] %lf\\n\",y[N-1]);\n   for (int i = 0; i < N; i++) if (y[i] != 4.0f) { printf(\"FAIL y[%d] = %f\\n\", i, y[i]); exit(1); }\n"
    why: "check: every y[i] is 2*1+2 = 4 exactly (x = 1, y = 2, a = 2; the example's own plausibility values)"
  saxpy_y2d_check: &saxpy_y2d_check
    old: "   printf(\"y[N-1][M-1] %lf\\n\",y[N-1][M-1]);\n"
    new: "   printf(\"y[N-1][M-1] %lf\\n\",y[N-1][M-1]);\n   for (int j = 0; j < N; j++) for (int i = 0; i < M; i++) if (y[j][i] != 4.0f) { printf(\"FAIL y[%d][%d] = %f\\n\", j, i, y[j][i]); exit(1); }\n"
    why: "check: every y[j][i] is 2*1+2 = 4 exactly (x = 1, y = 2, a = 2)"
  vecadd_check: &vecadd_check
    old: "  printf(\"Final result: %lf\\n\",sum);\n"
    new: "  printf(\"Final result: %lf\\n\",sum);\n  if (fabs(sum - 1.0) > 1e-9) { printf(\"FAIL sum = %.15f\\n\", sum); return 1; }\n"
    why: "check: the mean of sin^2+cos^2 is 1 (the example's own statement), within 1e-9"
  f_saxpy_check: &f_saxpy_check
    old: "end subroutine saxpy\n"
    new: "   if (any(y /= 4.0_real32)) stop 1\nend subroutine saxpy\n"
    why: "check: every y is 2 + 2*1 = 4 exactly (x = 1, y = 2, a = 2; the example's own plausibility values); a wrong value stops with code 1"
  f_n_small: &f_n_small
    old: "integer,parameter :: n = 10000000"
    new: "integer,parameter :: n = 100000"
    why: "n from 10^7 to 10^5 (the loop runs on one device thread)"
  f_sum_n: &f_sum_n
    old: "        Write(*,'(A,F0.12)') \"Result: sum of x is \",sum\n"
    new: "        Write(*,'(A,F0.12)') \"Result: sum of x is \",sum\n        if (sum /= real(N, rk)) stop 1\n"
    why: "check: compute sets each x to 1, so the sum is N exactly"
  f_vecadd_check: &f_vecadd_check
    old: "    write(*,'(\"Final result: \",f10.6)') sum\n"
    new: "    write(*,'(\"Final result: \",f10.6)') sum\n    if (abs(sum - 1.0d0) > 1.0d-9) stop 1\n"
    why: "check: the mean of sin^2+cos^2 is 1 (the example's own statement), within 1e-9"
  f_dtype_check: &f_dtype_check
    old: "        write(*,*) my_instance%values(10)\n"
    new: "        write(*,*) my_instance%values(10)\n        if (any(my_instance%values /= [(i, i=1,1024)])) stop 1\n"
    why: "check: every values(i) is i (the kernel's assignment), not only values(10)"
  f_mem_check: &f_mem_check
    old: "  print \"(A, I0, A, F0.5)\", \"Last Value: z(\", n, \")=\", z(n)\n"
    new: "  print \"(A, I0, A, F0.5)\", \"Last Value: z(\", n, \")=\", z(n)\n  if (any(z /= 7.0d0)) stop 1\n"
    why: "check: every z = a*x + y = 3*2 + 1 = 7 exactly, not only the last"
  f_saxpy_dealloc_check: &f_saxpy_dealloc_check
    old: "   deallocate(x,y)\nend subroutine saxpy\n"
    new: "   if (any(y /= 4.0_real32)) stop 1\n   deallocate(x,y)\nend subroutine saxpy\n"
    why: "check: every y is 2 + 2*1 = 4 exactly; a wrong value stops with code 1"
  enccs_c_check: &enccs_c_check
    old: "  printf(\"The sum is: %8.6f \\n\", sum);\n"
    new: "  printf(\"The sum is: %8.6f \\n\", sum);\n  double hv_ref = 0.0;\n  for (int i = 0; i < NX; i++) { if (vecC[i] != pow(r, i) * 1.0) return 1; hv_ref += pow(r, i) * 1.0; }\n  if (fabs(sum - hv_ref) > 1e-12) return 1;\n"
    why: "check: a host recomputation of every vecC = vecA*vecB = r^i and of their sum"
  enccs_c5_check: &enccs_c5_check
    old: "  printf(\"The sum is: %8.6f \\n\", sum);\n"
    new: "  printf(\"The sum is: %8.6f \\n\", sum);\n  double hv_ref = 0.0;\n  for (int i = 0; i < NX; i++) { if (vecC[i] != pow(r, i) * 1.0 + 0.5 * 2.0) return 1; hv_ref += pow(r, i) * 1.0 + 0.5 * 2.0; }\n  if (fabs(sum - hv_ref) > 1e-9) return 1;\n"
    why: "check: a host recomputation of every vecC = r^i*1 + 0.5*2 and of their sum"
  enccs_f_check: &enccs_f_check
    old: "\nend program dotproduct\n"
    new: "\n  if (any(vecC /= [(r**(i-1) * 1.0, i = 1, nx)])) stop 1\n  block\n    real :: hv_s\n    hv_s = 0.0\n    do i = 1, nx\n      hv_s = r**(i-1) * 1.0 + hv_s\n    end do\n    if (abs(sum - hv_s) > 1.0e-4) stop 2\n  end block\nend program dotproduct\n"
    why: "check: a host recomputation of every vecC = vecA*vecB = r^(i-1), and of their sum within 1e-4 (single precision)"
  vec_add_c_check: &vec_add_c_check
    old: "    return 0;\n"
    new: "    for (i = 0; i < NX; i++) if (vecC[i] != 3.0) return 1;\n    return 0;\n"
    why: "check: every vecC = 1 + 2 = 3 (the program prints nothing)"
  vec_add_f_check: &vec_add_f_check
    old: "end program\n"
    new: "  if (any(vecC /= 2.0d0)) stop 1\nend program\n"
    why: "check: every vecC = 1 + 1 = 2 (the program prints nothing)"
  csc_axpy_include: &csc_axpy_include
    old: "#include \"helper_functions.F90\"\n"
    new: ""
    why: "the #include of helper_functions.F90 replaced by the module put first (the harness compiles a .f90 without preprocessing)"
  csc_axpy_check: &csc_axpy_check
    old: "  print '(A)', \"Output:\"\n  call print_array(\"y\", y)\n"
    new: "  print '(A)', \"Output:\"\n  call print_array(\"y\", y)\n  do i = 1, n\n    frac = 1.0d0 / real(n - 1, kind=8)\n    if (abs(y(i) - (real(i - 1, kind=8) * frac * 100.0d0 + alpha * real(i - 1, kind=8) * frac)) > 1.0d-12 * 103.0d0) stop 1\n  end do\n"
    why: "check: a host recomputation of y = y0 + alpha*x for every element, within 1e-12 relative"
  csc_vecsum_check: &csc_vecsum_check
    old: "    printf(\"Reduction sum: %18.16f\\n\", sum);\n"
    new: "    printf(\"Reduction sum: %18.16f\\n\", sum);\n    for (i = 0; i < NX; i++) if (vecC[i] != vecA[i] * vecB[i]) return 1;\n"
    why: "check: a host recomputation of every vecC = vecA*vecB (exact)"
  triad_check_after_avg: &triad_check_after_avg
    old: "   printf(\"Average runtime for stream triad loop is %lf secs\\n\", time_sum/ntimes);\n"
    new: "   printf(\"Average runtime for stream triad loop is %lf secs\\n\", time_sum/ntimes);\n   for (int i=0; i<nsize; i++) if (c[i] != 7.0) { printf(\"FAIL c[%d] = %f\\n\", i, c[i]); return 1; }\n"
    why: "check: every c = a + scalar*b = 1 + 3*2 = 7 exactly"
  acc_triad_update_check: &acc_triad_update_check
    old: "#pragma acc exit data delete(a[0:nsize],b[0:nsize],c[0:nsize])\n"
    new: "#pragma acc update self(c[0:nsize])\n   for (int i=0; i<nsize; i++) if (c[i] != 7.0) { printf(\"FAIL c[%d] = %f\\n\", i, c[i]); return 1; }\n#pragma acc exit data delete(a[0:nsize],b[0:nsize],c[0:nsize])\n"
    why: "an update self of c added before exit data so the result reaches the host, then the check: every c = 1 + 3*2 = 7"
  lap_c_nn: &lap_c_nn
    old: "#define NN 4096\n#define NM 4096\n"
    new: "#define NN 256\n#define NM 256\n"
    why: "the mesh from 4096^2 to 256^2 (the host recomputation below repeats every iteration)"
  lap_c_check: &lap_c_check
    old: "    double runtime = GetTimer();\n"
    new: "    double runtime = GetTimer();\n    {\n        static double B[NN][NM], Bnew[NN][NM];\n        double err2 = 1.0;\n        int it2 = 0;\n        memset(B, 0, sizeof B);\n        memset(Bnew, 0, sizeof Bnew);\n        for (int j = 0; j < n; j++) { B[j][0] = 1.0; Bnew[j][0] = 1.0; }\n        while (err2 > tol && it2 < iter_max) {\n            err2 = 0.0;\n            for (int j = 1; j < n-1; j++)\n                for (int i = 1; i < m-1; i++) {\n                    Bnew[j][i] = 0.25 * (B[j][i+1] + B[j][i-1] + B[j-1][i] + B[j+1][i]);\n                    err2 = fmax(err2, fabs(Bnew[j][i] - B[j][i]));\n                }\n            for (int j = 1; j < n-1; j++)\n                for (int i = 1; i < m-1; i++) B[j][i] = Bnew[j][i];\n            it2++;\n        }\n        if (it2 != iter) return 1;\n        for (int j = 0; j < n; j++)\n            for (int i = 0; i < m; i++)\n                if (fabs(A[j][i] - B[j][i]) > 1e-12) return 1;\n    }\n"
    why: "check: the same Jacobi iteration recomputed on the host (iteration count and every A within 1e-12)"
  lap_f_n: &lap_f_n
    old: "  integer, parameter :: n=4096, m=4096, iter_max=1000\n"
    new: "  integer, parameter :: n=256, m=256, iter_max=1000\n"
    why: "the mesh from 4096^2 to 256^2 (the host recomputation below repeats every iteration)"
  lap_f_comma: &lap_f_comma
    old: "    if(mod(iter,100).eq.0 ) write(*,'(i5,f10.6)'), iter, error\n"
    new: "    if(mod(iter,100).eq.0 ) write(*,'(i5,f10.6)') iter, error\n"
    why: "the comma after the write statement's control list removed (an extension)"
  lap_f_check: &lap_f_check
    old: "  deallocate (A,Anew)\n"
    new: "  block\n    real(fp_kind), allocatable :: B(:,:), Bnew(:,:)\n    real(fp_kind) :: err2\n    integer :: it2\n    allocate(B(0:n-1,0:m-1), Bnew(0:n-1,0:m-1))\n    B = 0.0_fp_kind\n    Bnew = 0.0_fp_kind\n    B(0,:) = 1.0_fp_kind\n    Bnew(0,:) = 1.0_fp_kind\n    err2 = 1.0_fp_kind\n    it2 = 0\n    do while (err2 > tol .and. it2 < iter_max)\n      err2 = 0.0_fp_kind\n      do j=1,m-2\n        do i=1,n-2\n          Bnew(i,j) = 0.25_fp_kind * (B(i+1,j) + B(i-1,j) + B(i,j-1) + B(i,j+1))\n          err2 = max(err2, abs(Bnew(i,j)-B(i,j)))\n        end do\n      end do\n      it2 = it2 + 1\n      do j=1,m-2\n        do i=1,n-2\n          B(i,j) = Bnew(i,j)\n        end do\n      end do\n    end do\n    if (it2 /= iter .or. maxval(abs(A - B)) > 1.0e-12_fp_kind) stop 1\n  end block\n  deallocate (A,Anew)\n"
    why: "check: the same Jacobi iteration recomputed on the host (iteration count and every A within 1e-12)"
  lap_f_check_jacobi: &lap_f_check_jacobi
    old: "  deallocate (A,Anew)\nend program jacobi\n"
    new: "  block\n    real(fp_kind), allocatable :: B(:,:), Bnew(:,:)\n    real(fp_kind) :: err2\n    integer :: it2\n    allocate(B(0:n-1,0:m-1), Bnew(0:n-1,0:m-1))\n    B = 0.0_fp_kind\n    Bnew = 0.0_fp_kind\n    B(0,:) = 1.0_fp_kind\n    Bnew(0,:) = 1.0_fp_kind\n    err2 = 1.0_fp_kind\n    it2 = 0\n    do while (err2 > tol .and. it2 < iter_max)\n      err2 = 0.0_fp_kind\n      do j=1,m-2\n        do i=1,n-2\n          Bnew(i,j) = 0.25_fp_kind * (B(i+1,j) + B(i-1,j) + B(i,j-1) + B(i,j+1))\n          err2 = max(err2, abs(Bnew(i,j)-B(i,j)))\n        end do\n      end do\n      it2 = it2 + 1\n      do j=1,m-2\n        do i=1,n-2\n          B(i,j) = Bnew(i,j)\n        end do\n      end do\n    end do\n    if (it2 /= iter .or. maxval(abs(A - B)) > 1.0e-12_fp_kind) stop 1\n  end block\n  deallocate (A,Anew)\nend program jacobi\n"
    why: "check: the same Jacobi iteration recomputed on the host (iteration count and every A within 1e-12)"
  bp_saxpy_c_check: &bp_saxpy_c_check
    old: "  printf(\"%f %f\\n\",y[0],y[N-1]);\n"
    new: "  printf(\"%f %f\\n\",y[0],y[N-1]);\n  for (i=0; i<N; i++) if (y[i] != 2.0f * (float)(i+1)) return 1;\n"
    why: "check: every y = 2x = 2(i+1) exactly"
  bp_saxpy_f_check: &bp_saxpy_f_check
    old: "  print *, y(1), y(N)\n"
    new: "  print *, y(1), y(N)\n  do i=1,N\n    if (y(i) /= 2.0 * i) stop 1\n  end do\n"
    why: "check: every y = 2x = 2i exactly"
  urban_size: &urban_size
    old: "#define WIDTH      1000\n#define HEIGHT     1000\n"
    new: "#define WIDTH      200\n#define HEIGHT     200\n"
    why: "the plate from 1000^2 to 200^2 (the host recomputation below repeats every iteration)"
  urban_check: &urban_check
    old: "    gettimeofday(&stop_time,NULL);\n"
    new: "    {\n        static double T[HEIGHT+2][WIDTH+2], Tp[HEIGHT+2][WIDTH+2];\n        double w = 100;\n        int it = 1;\n        for (int a = 0; a <= HEIGHT+1; a++) for (int b = 0; b <= WIDTH+1; b++) Tp[a][b] = 0.0;\n        for (int a = 0; a <= HEIGHT+1; a++) { Tp[a][0] = 0.0; Tp[a][WIDTH+1] = (100.0/HEIGHT)*a; }\n        for (int b = 0; b <= WIDTH+1; b++) { Tp[0][b] = 0.0; Tp[HEIGHT+1][b] = (100.0/WIDTH)*b; }\n        while (w > TEMP_TOLERANCE) {\n            for (int a = 1; a <= HEIGHT; a++) for (int b = 1; b <= WIDTH; b++)\n                T[a][b] = 0.25 * (Tp[a+1][b] + Tp[a-1][b] + Tp[a][b+1] + Tp[a][b-1]);\n            w = 0.0;\n            for (int a = 1; a <= HEIGHT; a++) for (int b = 1; b <= WIDTH; b++) {\n                w = fmax(fabs(T[a][b] - Tp[a][b]), w);\n                Tp[a][b] = T[a][b];\n            }\n            it++;\n        }\n        if (it != iteration || w != worst_dt) return 1;\n        for (int a = 0; a <= HEIGHT+1; a++) for (int b = 0; b <= WIDTH+1; b++)\n            if (fabs(Tp[a][b] - Temperature_previous[a][b]) > 1e-12) return 1;\n    }\n    gettimeofday(&stop_time,NULL);\n"
    why: "check: the same iteration recomputed on the host (iteration count, final maximum change and every temperature within 1e-12)"
