# --- The remaining static restrictions ---

  - id: worksharing-nesting-001
    check: static
    status: provisional
    predicate: worksharing_closely_nested
    example: "!$omp parallel / !$omp single / !$omp do / do ... / !$omp end single / !$omp end parallel"
    notes: "5.2 states the static rule. 6.0 states it only in the informative Appendix C ('A team-executed region may not be closely nested inside a partitioned worksharing region, a region that corresponds to a thread-exclusive construct, or a region that corresponds to a task-generating construct that is not a team-generating construct'), as a consequence of the cited 6.0 §13 rule: the inner region is encountered by only some threads of its binding team, so the rule is certain whenever the team has more than one thread; a one-thread team is not excepted (owner point). Isolation: a do construct directly inside a single (or task) construct inside a parallel construct."
    spec:
      50:
        citation: "OpenMP 5.0 §2.20, p.328"
        text: "A worksharing region may not be closely nested inside a worksharing, loop, task, taskloop, critical, ordered, atomic, or master region."
      52:
        citation: "OpenMP 5.2 §17.1, p.338"
        text: "A worksharing region may not be closely nested inside a worksharing, task, taskloop, critical, ordered, atomic, or masked region."
      60:
        citation: "OpenMP 6.0 §13, p.404"
        text: "Each work-distribution region must be encountered by all threads in the binding thread set or by none at all unless cancellation has been requested for the innermost enclosing parallel region."

  - id: simd-nesting-001
    check: static
    status: provisional
    predicate: simd_simdizable_only
    example: "!$omp simd / do ... / !$omp parallel / ... / !$omp end parallel / end do"
    notes: "SIMDizable: simd, atomic, loop without bind(teams/parallel) (its binding region is then not defined, 6.0 §13.8 p.423), ordered with the simd clause; 6.0 also the loop-transforming constructs. Separating and declarative directives (scan) are not constructs. Isolation: a parallel (or task) construct in the loop body of a simd construct."
    spec:
      50:
        citation: "OpenMP 5.0 §2.9.3.1, p.113"
        text: "The only OpenMP constructs that can be encountered during execution of a simd region are the atomic construct, the loop construct, the simd construct and the ordered construct with the simd clause."
      52:
        citation: "OpenMP 5.2 §10.4, p.235"
        text: "Only simdizable constructs can be encountered during execution of a simd region."
        also: ["OpenMP 5.2 §17.1, p.338"]
      60:
        citation: "OpenMP 6.0 §12.4, p.399"
        text: "Only SIMDizable constructs may be encountered during execution of a simd region."

  - id: order-nesting-002
    check: static
    status: provisional
    predicate: order_concurrent_no_api_calls
    example: "!$omp parallel do order(concurrent) / do ... / x = omp_get_thread_num() / end do"
    notes: "A loop construct without an order clause counts as order(concurrent) (5.2 §11.7, 6.0 §13.8). 6.0: no runtime routine has the order-concurrent-nestable property. Isolation: a call omp_get_thread_num() in the body of parallel do order(concurrent)."
    spec:
      50:
        citation: "OpenMP 5.0 §2.9.5, p.131"
        text: "A loop region corresponding to a loop construct may not contain calls to the OpenMP Runtime API."
        also: ["OpenMP 5.0 §2.9.2, p.108", "OpenMP 5.0 §2.9.3.1, p.113"]
      52:
        citation: "OpenMP 5.2 §10.3, p.234"
        text: "A region that corresponds to a construct with an order clause that specifies concurrent may not contain OpenMP runtime API calls."
        also: ["OpenMP 5.2 §17.1, p.339"]
      60:
        citation: "OpenMP 6.0 §12.3, p.398"
        text: "The only routines for which a call may be nested inside a region that corresponds to a construct on which the order clause is specified with concurrent as the ordering argument are order-concurrent-nestable routines."

  - id: ordered-nesting-001
    check: static
    status: provisional
