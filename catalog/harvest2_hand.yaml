  - id: h2-princeton-acc-f-laplace2d-kernels
    repo: PrincetonUniversity/hpc_beginning_workshop
    path: openacc/fortran/laplace2d.f90
    license: "Apache-2.0 (the file's notice: Copyright 2012 NVIDIA Corporation); repository MIT"
    edits:
      - {old: "    if(mod(iter,100).eq.0 ) write(*,'(i5,f10.6)'), iter, error\n", new: "    if(mod(iter,100).eq.0 ) write(*,'(i5,f10.6)') iter, error\n", why: "the comma after the write statement's control list removed (an extension)"}
      - {old: "!$acc end data\n", new: "!$acc end data\n  block\n    real(fp_kind), allocatable :: B(:,:), Bnew(:,:)\n    real(fp_kind) :: err2\n    integer :: it2\n    allocate(B(0:n-1,0:m-1), Bnew(0:n-1,0:m-1))\n    B = 0.0_fp_kind\n    Bnew = 0.0_fp_kind\n    B(0,:) = 1.0_fp_kind\n    Bnew(0,:) = 1.0_fp_kind\n    err2 = 1.0_fp_kind\n    it2 = 0\n    do while (err2 > tol .and. it2 < iter_max)\n      err2 = 0.0_fp_kind\n      do j=1,m-2\n        do i=1,n-2\n          Bnew(i,j) = 0.25_fp_kind * (B(i+1,j) + B(i-1,j) + B(i,j-1) + B(i,j+1))\n          err2 = max(err2, abs(Bnew(i,j)-B(i,j)))\n        end do\n      end do\n      it2 = it2 + 1\n      do j=1,m-2\n        do i=1,n-2\n          B(i,j) = Bnew(i,j)\n        end do\n      end do\n    end do\n    if (it2 /= iter .or. maxval(abs(A - B)) > 1.0e-12_fp_kind) stop 1\n  end block\n", why: "check: the same Jacobi iteration recomputed on the host (iteration count and every A within 1e-12)"}
    why: "Jacobi relaxation with kernels regions and a max reduction the kernels construct leaves to the compiler; the host recomputation"
