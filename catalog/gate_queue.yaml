groups:
- id: nvhpc-postdiag-crash
  verdict: nondeterministic_defect
  title: NVHPC front end segfaults after its own severe diagnostic, intermittently
  legality: 'Legal for its version. acc34-clause-gang-dim: the atomic update b(i) = b(i) + 2*a(i) + 1
    is x = x operator expr, which ''must be mathematically equivalent to x binop (expr)'' (OpenACC 3.4
    §2.12 p.78 l.2854-2856; ruling 2026-10-25: the precedence and parentheses forms are sufficient,
    not necessary; AFAR flang''s rejection is a dispute note, not a witness). omp52-c-w-ordered: an ordered
    region binds to the innermost worksharing-loop region and needs an ordered clause of parameter one
    there (5.2 §15.10.2 p.331 l.16-17), which an ordered clause without n is (§4.4.4 p.94 l.18-19). fuzz
    n1x0-nvhpc269:58: thread_limit on target is 5.2 (§13.3 p.277: directives target, teams), a 5.1 form
    NVHPC does not claim (rule R11c: unsupported, not a bug); its other diagnostic (S-0099 ''Illegal use
    of derived type'') follows.'
  determinism: 'The diagnostic is the same in every compile. Whether the front end (fort2, fort1, nvcpfe)
    then dies with signal 11 varies from compile to compile of the same file in the same directory (data/evidence/gate_probe/logs/wingtip3.log:
    fixed paths, repeated); for nvcpfe long absolute source paths crash more often, a relative file name
    never did (0 of 80). No other condition was found: a compiler defect that shows intermittently.'
  action: 'The cell counts as an ICE (the crash; the rejection is in every run). gang-dim: linked to the
    existing finding; ordered: promoted; the fuzz bundle: candidate, not reduced.'
  counts_as: failure
- id: afar-hostdev-update
  verdict: nondeterministic_defect
  title: 'AFAR: concurrent target update of disjoint sections from host threads loses data'
  legality: 'Legal: four host threads each update their own disjoint section of a present array (''Assignment
    is performed to either the original or corresponding list item as specified with the specific data-motion
    clauses'', 5.2 §5.9 p.165 l.7-12; 5.0 the same rule); the target regions write disjoint elements;
    i is private in the target region (5.2 §5.1.1 p.97 l.22-23). Read against the spec; the pre-run check''s
    flang witness is AFAR''s own front end, so it is not counted for the AFAR cells.'
  determinism: 'A race inside the runtime, not in the program: the failure rate differs by device (MI300A
    copy mode: most runs fail; MI250X: rare).'
  action: Linked to target-update-sections-in-parallel.f90 (its programs pattern already names omp5?-directive-target-hostdev);
    the cell counts as wrong_answer.
  finding: target-update-sections-in-parallel.f90
